<title>Outreach Management</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap">
<style id="logo-asset">:root{--dove:url("data:image/png;base64,__DOVE_PNG_BASE64__")}</style>
<style>
/* Layout concept: a persistent plum sidebar beside a white work canvas. Below 960px the sidebar becomes a slide-in drawer under a sticky top bar. */
:root{
  --font-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;

  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F8F4F7;
  --line:#E8DFE6; --line-strong:#CDBFCA;
  --fg:#231A21; --fg-2:#5A4F5E; --fg-3:#6B6070;

  --brand:#882865; --brand-hover:#6E1F51; --on-brand:#FFFFFF;
  --brand-text:#882865; --brand-soft:#F6E9F1; --brand-soft-fg:#6E1F51;
  --accent:#EFB43C; --on-accent:#3A2A05;
  --danger:#B42318; --on-danger:#FFFFFF;

  --good-bg:#E3F3E8; --good-fg:#1B6A39;
  --warn-bg:#FCEFCF; --warn-fg:#7A4A00;
  --bad-bg:#FADFDF; --bad-fg:#9A1B1B;
  --neutral-bg:#ECE7EB; --neutral-fg:#4A4050;

  --side-bg:#882865; --side-fg:#FFFFFF; --side-fg-2:rgba(255,255,255,.82);
  --side-hover:rgba(255,255,255,.10); --side-active:rgba(255,255,255,.18);

  --focus:#882865; --scrim:rgba(24,12,21,.55);
  --shadow:0 1px 2px rgba(35,26,33,.06), 0 6px 20px rgba(35,26,33,.06);
  --band:var(--surface);

  /* chart colours: one plum for single series, plum and amber for two, a quiet grey for contrast, and a one-hue ramp for ordered stages */
  --viz-1:#882865; --viz-2:#B7791F; --viz-gray:#8E8591;
  --st1:#D9A0C2; --st2:#C277A5; --st3:#A9528A; --st4:#882865; --st5:#6A1D4F; --st6:#4D1438; --st-closed:#9A919D;
  --viz-grid:#EFE8EE; --viz-base:#CDBFCA; --viz-tick:#6B6070;

  --side-w:248px; --radius:12px; --radius-sm:8px;
  --gutter:clamp(16px, 3.2vw, 40px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
/*__DARK_TOKENS__*/
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
/*__DARK_TOKENS__*/
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
/* A class that sets display (flex, grid) would otherwise beat the hidden attribute. This keeps hidden meaning hidden everywhere. */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--font-body);-webkit-text-size-adjust:100%}
body.in-login{--band:var(--brand-soft)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
#root{height:100%}
h1,h2,h3,p,ul,ol,dl,figure,blockquote{margin:0}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--brand);color:var(--on-brand);padding:10px 14px;border-radius:8px;font-weight:600}
.skip:focus{left:max(16px,env(safe-area-inset-left,0px))}
.muted{color:var(--fg-2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ic{flex:none}
.dove{display:block;aspect-ratio:360/337;max-width:100%;background-color:var(--dove-ink,var(--brand-text));-webkit-mask:var(--dove) center/contain no-repeat;mask:var(--dove) center/contain no-repeat}
.boot{display:grid;place-items:center;align-content:center;gap:14px;min-height:100%;color:var(--fg-2);text-align:center;padding:24px}
.boot .dove{width:72px}

/* Buttons and links */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--radius-sm);border:1px solid transparent;font:600 14.5px/1 var(--font-body);cursor:pointer;white-space:nowrap;text-decoration:none}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:var(--brand-hover)}
.btn-secondary{background:var(--surface);color:var(--fg);border-color:var(--line-strong)}
.btn-secondary:hover{background:var(--surface-2)}
.btn-danger{background:var(--danger);color:var(--on-danger)}
.btn-danger:hover{filter:brightness(.92)}
.btn-ghost{background:transparent;color:var(--brand-text);padding:0 10px}
.btn-ghost:hover{background:var(--brand-soft)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:0 12px;font-size:13.5px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
@media (pointer:coarse){.btn-sm{min-height:44px}}
.link{background:none;border:0;padding:0;color:var(--brand-text);font:inherit;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border:0;border-radius:var(--radius-sm);background:transparent;color:inherit;cursor:pointer}
.icon-btn:hover{background:var(--surface-2)}

/* Forms */
.field{display:grid;gap:6px;margin-bottom:16px;min-width:0}
.field>label,.label{font-weight:600;font-size:13.5px}
.field input,.field select{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--fg);font:inherit}
.field input::placeholder{color:var(--fg-3)}
.field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--bad-fg)}
.hint{font-size:12.5px;color:var(--fg-2)}
.err{font-size:13px;color:var(--bad-fg);font-weight:500}
.err:empty{display:none}
.form-error{color:var(--bad-fg);background:var(--bad-bg);padding:10px 12px;border-radius:var(--radius-sm);margin-bottom:14px;font-size:14px}
.input-group{position:relative;display:block}
.input-group input{padding-right:48px}
.input-group .icon-btn{position:absolute;right:2px;top:2px;width:40px;height:40px}
.checks{display:grid;gap:4px}
.check{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 4px;font-size:14.5px}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
.rules{list-style:none;padding:0;margin:0 0 16px;display:grid;gap:4px;font-size:13px;color:var(--fg-2)}
.rules li{display:flex;gap:8px;align-items:center}
.rules svg{width:16px;height:16px}
.rules .ok{color:var(--good-fg)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--radius-sm);font-size:14px;margin-bottom:16px}
.notice.good{background:var(--good-bg);color:var(--good-fg)}
.notice.warn{background:var(--warn-bg);color:var(--warn-fg)}
.notice.bad{background:var(--bad-bg);color:var(--bad-fg)}
.notice svg{margin-top:1px}

/* Badges, chips, avatars */
.badge{display:inline-flex;align-items:center;gap:6px;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;line-height:1.7;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.good{background:var(--good-bg);color:var(--good-fg)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.badge.bad{background:var(--bad-bg);color:var(--bad-fg)}
.badge.neutral{background:var(--neutral-bg);color:var(--neutral-fg)}
.badge.brand{background:var(--brand-soft);color:var(--brand-soft-fg)}
.badge.brand::before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:1px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);font-size:12.5px;color:var(--fg-2)}
.chip.muted{opacity:.75}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-soft);color:var(--brand-soft-fg);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}

/* Cards and page structure */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h2{font:600 17px/1.3 var(--font-body);margin-bottom:6px}
.card>p+p{margin-top:10px}
.stack{display:grid;gap:20px}
.grid-2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px;align-items:start}
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.main{min-width:0;display:flex;flex-direction:column}
.page{width:100%;max-width:1180px;padding-block:28px 56px;padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.page-head>div{min-width:0}
.page-head h1{font:700 clamp(28px,3.4vw,34px)/1.12 var(--font-display);color:var(--brand-text);text-wrap:balance}
.page-head h1:focus{outline:none}
.page-head .sub{margin-top:6px;color:var(--fg-2)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2)}
.banner{padding:10px max(var(--gutter),env(safe-area-inset-right,0px)) 10px max(var(--gutter),env(safe-area-inset-left,0px));background:var(--warn-bg);color:var(--warn-fg);font-size:14px}

/* Sidebar */
.sidebar{background:var(--side-bg);color:var(--side-fg)}
.side-inner{position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:22px;overflow-y:auto;padding:22px 14px 16px;padding-left:max(14px,env(safe-area-inset-left,0px))}
.side-brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.side-brand .dove{width:46px;--dove-ink:#FFFFFF}
.side-name{font:700 20px/1.05 var(--font-display)}
.side-org{margin-top:4px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-fg-2)}
.side-close{display:none;margin-left:auto;color:var(--side-fg)}
.side-close:hover{background:var(--side-hover)}
.nav{list-style:none;padding:0;display:grid;gap:4px}
.nav-item{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:0 12px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--side-fg);font:500 14.5px var(--font-body);text-align:left;cursor:pointer}
.nav-item:hover{background:var(--side-hover)}
.nav-item[aria-current="page"]{background:var(--side-active);font-weight:600}
.nav-item[aria-current="page"]::before{content:"";position:absolute;left:calc(-1 * max(14px,env(safe-area-inset-left,0px)));top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.nav-item:focus-visible,.side-close:focus-visible{outline-color:#FFFFFF}
.soon{margin-left:auto;font-size:11px;letter-spacing:.04em;padding:0 7px;border:1px solid rgba(255,255,255,.5);border-radius:999px;color:var(--side-fg-2)}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.2)}
.side-user .avatar{background:rgba(255,255,255,.18);color:#FFFFFF}
.side-user p{line-height:1.25}
.side-user .who{font-weight:600;font-size:14px}
.side-user .role{font-size:12.5px;color:var(--side-fg-2)}
.scrim{display:none}

/* Top bar and account menu */
.topbar{display:flex;align-items:center;gap:10px;min-height:60px;padding-block:8px;background:var(--surface);border-bottom:1px solid var(--line);padding-left:max(var(--gutter),env(safe-area-inset-left,0px));padding-right:max(var(--gutter),env(safe-area-inset-right,0px))}
.topbar .spacer{flex:1}
.hamburger{display:none}
.brand-mini{display:none;align-items:center;gap:10px;font:700 19px/1 var(--font-display);color:var(--brand-text)}
.brand-mini .dove{width:30px}
.proto-badge{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px dashed var(--line-strong);background:var(--surface-2);color:var(--fg-2);font:600 12.5px var(--font-body);cursor:pointer}
.proto-badge:hover{border-color:var(--brand-text);color:var(--brand-text)}
.proto-badge .short{display:none}
.account{position:relative}
.account-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:3px 12px 3px 4px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:600 14px var(--font-body);cursor:pointer}
.account-btn:hover{background:var(--surface-2)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:250px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:8px;z-index:20}
.menu-head{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;overflow-wrap:anywhere}
.menu-head strong{display:block}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 10px;border:0;border-radius:var(--radius-sm);background:transparent;color:var(--fg);font:500 14.5px var(--font-body);cursor:pointer;text-align:left}
.menu-item:hover{background:var(--surface-2)}

/* Tables */
.toolbar{display:grid;grid-template-columns:minmax(0,1fr) 190px 210px;gap:12px;margin-bottom:4px}
.search .input-group svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--fg-3)}
.search input{padding-left:40px}
.summary-row{display:flex;flex-wrap:wrap;gap:8px 20px;margin-bottom:16px;color:var(--fg-2);font-size:14px}
.summary-row b{color:var(--fg);font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);font-weight:600;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.table td{padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.person .who{min-width:0}
.person .name{font-weight:600}
.person .sub{color:var(--fg-2);font-size:13px;overflow-wrap:anywhere}
.matrix{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
.matrix th,.matrix td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:center;vertical-align:top}
.matrix th:first-child,.matrix td:first-child{text-align:left}
.matrix thead th{background:var(--surface-2);font-size:12.5px;font-weight:600}
.matrix .yes{color:var(--good-fg)}
.matrix .no{color:var(--fg-3)}
.matrix td.scope{font-size:12.5px;color:var(--fg-2);text-align:left}
.empty-block{text-align:left;color:var(--fg-2)}
.empty-block h2{color:var(--fg)}
.rowlist{list-style:none;padding:0;display:grid}
.rowlist li{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.rowlist li:last-child{border-bottom:0}
.rowlist .grow{flex:1;min-width:160px}
.inline-form{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.inline-form .field{margin-bottom:0;flex:1;min-width:200px}

/* Definition lists, ticks, scripture */
.dl{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:10px 20px}
.dl dt{font-weight:600}
.dl dd{margin:0;color:var(--fg-2)}
.ticks{list-style:none;padding:0;display:grid;gap:6px;margin:10px 0}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks svg{margin-top:2px;color:var(--good-fg);width:18px;height:18px}
.scope-note{font-size:13.5px;color:var(--fg-2)}
.scripture-card{background:var(--brand-soft);border-color:transparent;box-shadow:none}
.scripture blockquote{font:italic 600 clamp(22px,2.3vw,27px)/1.3 var(--font-display);color:var(--brand-soft-fg)}
.scripture figcaption{margin-top:10px;font-size:13px;color:var(--fg-2);letter-spacing:.04em}

/* Dialogs and toasts */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100dvh - 32px);background:var(--surface);color:var(--fg);box-shadow:0 24px 64px rgba(0,0,0,.35)}
dialog::backdrop{background:var(--scrim)}
.dlg{display:flex;flex-direction:column;max-height:calc(100dvh - 34px)}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 12px 0 20px}
.dlg-head h2{font:700 24px/1.2 var(--font-display);color:var(--brand-text);padding-top:6px}
.dlg-body{padding:14px 20px 8px;overflow-y:auto}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:14px 20px 18px;border-top:1px solid var(--line)}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:var(--radius-sm);background:var(--surface-2);border:1px solid var(--line-strong);margin:12px 0}
.code-box code{font:700 22px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;overflow-wrap:anywhere}
.section-title{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);font-weight:600;margin:18px 0 8px}
.danger-zone{display:flex;flex-wrap:wrap;gap:8px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px;margin:4px 0 8px}
.meta dt{color:var(--fg-2)}
.meta dd{margin:0;overflow-wrap:anywhere}
.toasts{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom,0px));display:grid;justify-items:center;gap:8px;pointer-events:none;z-index:60;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:center;background:var(--surface);color:var(--fg);border:1px solid var(--line-strong);padding:12px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:min(520px,100%);font-size:14.5px}
.toast.good svg{color:var(--good-fg)}
.toast.bad svg{color:var(--bad-fg)}

/* Recorder, session lists, profile and timeline */
.field textarea{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--surface);color:var(--fg);font:inherit;resize:vertical}
.field textarea[aria-invalid="true"]{border-color:var(--bad-fg)}
.field input[type="date"],.field input[type="time"]{min-width:0}
.notice .grow{flex:1;min-width:0}
.inline-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 14px}
.toolbar-1{margin-bottom:4px;max-width:420px}
.toolbar-2{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:12px;margin-bottom:4px}
.backrow{margin:-6px 0 12px}
.link.back{display:inline-flex;align-items:center;gap:6px;min-height:44px;text-decoration:none}
.notes-text{white-space:pre-wrap;overflow-wrap:anywhere}
.stepper{list-style:none;padding:0;margin:0 0 20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stepper li{display:flex;align-items:center;gap:10px;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--fg-2);font-size:13.5px;font-weight:600}
.stepper .num{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);font-size:13px}
.stepper li.now{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-soft-fg)}
.stepper li.now .num{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.stepper li.done .num{background:var(--good-bg);border-color:transparent;color:var(--good-fg)}
.pcard{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);padding:18px;min-width:0}
.pcard-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.pcard-head h3{font:600 16px/1.3 var(--font-body);margin:0}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line-strong);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:16px}
.seg-btn{min-height:44px;padding:0 14px;border:0;background:var(--surface);color:var(--fg);font:500 14px var(--font-body);cursor:pointer}
.seg-btn+.seg-btn{border-left:1px solid var(--line-strong)}
.seg-btn[aria-pressed="true"]{background:var(--brand);color:var(--on-brand);font-weight:600}

/* ---------- crypto (WebCrypto; mirrors Django's PBKDF2 hasher) ---------- */
const enc = new TextEncoder();
function toB64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }

  return r === 0;
}
async function pbkdf2(password, salt, iterations) {

  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: salt, iterations: iterations }, key, 256);
  return new Uint8Array(bits);
}
async function hashPassword(password) {

}

  if (parts.length !== 4 || parts[0] !== 'pbkdf2_sha256') return false;
  const dk = await pbkdf2(password, fromB64(parts[2]), parseInt(parts[1], 10));
  return constantTimeEqual(toB64(dk), parts[3]);

}
function normaliseCode(c) { return String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }

const clean = s => String(s == null ? '' : s).trim();

function pad2(n) { return (n < 10 ? '0' : '') + n; }

/* ---------- outreach: names, duplicates and contact validation ---------- */
function normName(n) {
  return String(n || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^\p{L}\p{N}\s]/gu, ' ').replace(/\s+/g, ' ').trim();
}
function withinOneEdit(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, edits = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++edits > 1) return false;
    if (a.length > b.length) i++; else if (a.length < b.length) j++; else { i++; j++; }
  }
  return edits + (a.length - i) + (b.length - j) <= 1;
}
// Used to *suggest* a possible match for a human to check. It never merges anything.
function nameLooksSame(a, b) {
  const x = normName(a), y = normName(b);
  if (x.length < 2 || y.length < 2) return false;
  if (x === y) return true;
  const tx = x.split(' '), ty = y.split(' ');
  const shorter = tx.length <= ty.length ? tx : ty, longer = tx.length <= ty.length ? ty : tx;
  if (shorter.every(t => longer.indexOf(t) !== -1)) return true;
  return x.length >= 4 && y.length >= 4 && withinOneEdit(x, y);
}
function validatePersonLabel(value) {
  const v = clean(value);
  if (!v) return 'Enter a name, or a short label if you didn’t catch it.';
  if (v.length < 2) return 'Use at least 2 characters.';
  if (v.length > 80) return 'Keep this under 80 characters.';
  return '';
}
function validatePhone(value) {
  const v = clean(value); if (!v) return '';
  const digits = v.replace(/\D/g, '');
  if (!/^[+(\d][\d\s().-]*$/.test(v) || digits.length < 7 || digits.length > 15) return 'Use digits, spaces and + only (7 to 15 digits).';
  return '';

/* ---------- outreach: scoped reads (the model for scoped querysets) ----------
   Every read starts from the sessions the actor may reach. People and encounters are reached only through those sessions,
   so a crafted id can never pull in another team’s record. "Not found" and "not allowed" look identical on purpose. */
function scopeSessionIds(state, actor) {
  if (!actor || actor.status !== 'active') return [];
  const kind = SCOPE_KIND[actor.role];
  if (kind !== 'own' && kind !== 'team') return [];
  const mine = deptIdsOf(state, actor.id);
  return state.sessions.filter(s => {
    if (s.archived) return false;
    if (s.createdBy === actor.id) return true;
    if (kind === 'own') return s.participantIds.indexOf(actor.id) !== -1;
    return !!s.departmentId && mine.indexOf(s.departmentId) !== -1;

  const actor = getUser(state, actorId);
  if (!can(actor, 'sessions.view')) return [];
  const ids = scopeSessionIds(state, actor);
  return state.sessions.filter(s => ids.indexOf(s.id) !== -1).sort((a, b) => eventTs(b) - eventTs(a) || b.enteredAt - a.enteredAt);
}

  if (!can(actor, 'people.view')) return [];

  state.encounters.forEach(e => { if (sids.indexOf(e.sessionId) !== -1) seen[e.personId] = true; });
  return state.people.filter(p => seen[p.id] && !p.archived).map(p => p.id);
}
// Contact details are the most sensitive field. Evangelists see them only for people they recorded themselves.
function canSeeContact(state, actor, personId) {
  if (personIdsInScope(state, actor).indexOf(personId) === -1) return false;
  if (SCOPE_KIND[actor.role] === 'own') return state.encounters.some(e => e.personId === personId && e.recordedBy === actor.id);
  return true;
}
function personRows(state, actor) {
  const sids = scopeSessionIds(state, actor), byId = {};
  state.sessions.forEach(s => { byId[s.id] = s; });
  return personIdsInScope(state, actor).map(id => {
    const p = state.people.find(x => x.id === id);
    const encs = state.encounters.filter(e => e.personId === id && sids.indexOf(e.sessionId) !== -1);
    const dates = encs.map(e => byId[e.sessionId].outreachDate).sort();
    return { id: p.id, name: p.name, timesMet: encs.length, firstMetDate: dates[0], lastMetDate: dates[dates.length - 1], followUpSuggested: encs.filter(e => e.followUpSuggested).length };
  });
}
// Directory search and the "already in the system" lookup. Matches names always; phone or email only where the actor may see them.
function searchPeople(state, actorId, query, limit) {
  const actor = getUser(state, actorId);
  if (!can(actor, 'people.view')) return [];
  const q = normName(query), raw = clean(query).toLowerCase(), digits = raw.replace(/\D/g, '');
  const rows = personRows(state, actor).filter(r => {
    if (!q && !raw) return true;
    if (q && normName(r.name).indexOf(q) !== -1) return true;
    if (!canSeeContact(state, actor, r.id)) return false;
    const p = state.people.find(x => x.id === r.id);
    return (raw.indexOf('@') !== -1 && p.email.toLowerCase().indexOf(raw) !== -1) || (digits.length >= 4 && p.phone.replace(/\D/g, '').indexOf(digits) !== -1);
  }).sort((a, b) => a.name.localeCompare(b.name));

}

  const actor = getUser(state, actorId);
  if (!can(actor, 'people.view') || normName(name).length < 2) return [];

}
function sessionDetail(state, actorId, sessionId) {

  const sids = scopeSessionIds(state, actor), byId = {};
  state.sessions.forEach(x => { byId[x.id] = x; });
  const encounters = state.encounters.filter(e => e.sessionId === s.id).map(e => {
    const p = state.people.find(x => x.id === e.personId);
    const metBefore = state.encounters.some(o => o.personId === e.personId && o.sessionId !== s.id && sids.indexOf(o.sessionId) !== -1 && eventTs(byId[o.sessionId]) < eventTs(s));
    return { encounter: e, person: p ? { id: p.id, name: p.name } : null, metBefore: metBefore, canOpen: can(actor, 'people.view'), recorder: getUser(state, e.recordedBy) };
  });
  return { session: s, area: state.areas.find(a => a.id === s.areaId) || null, team: state.departments.find(d => d.id === s.departmentId) || null,
    creator: getUser(state, s.createdBy), participants: s.participantIds.map(id => getUser(state, id)).filter(Boolean), encounters: encounters };

    .sort((a, b) => eventTs(b.session) - eventTs(a.session));

    contact: showContact ? { phone: p.phone, email: p.email, voluntary: p.contactVoluntary } : null,
    timeline: timeline, timesMet: timeline.length, firstMetDate: dates[0], lastMetDate: dates[dates.length - 1],
    followUpSuggested: timeline.filter(t => t.encounter.followUpSuggested).length,

// Aggregate counts for the dashboard. Pastors get church-wide totals and never see a name.
function outreachStats(state, actorId) {

/* ---------- outreach: recording a session ---------- */
function myActiveTeamIds(state, userId) { return deptIdsOf(state, userId).filter(id => state.departments.some(d => d.id === id && d.active)); }
// Pure check of a whole draft. The form calls it step by step; createSession calls it again before saving anything.
function validateSessionDraft(state, actor, input) {
  const errors = {}, personErrors = [], d = (input && input.session) || {}, people = (input && input.people) || [];
  const today = isoDate(Date.now());
  if (!clean(d.outreachDate)) errors.outreachDate = 'Choose the date the outreach took place.';
  else if (!parseIsoDate(d.outreachDate)) errors.outreachDate = 'Enter a valid date.';
  else if (d.outreachDate > today) errors.outreachDate = 'The outreach date can’t be in the future.';
  if (clean(d.startTime)) {
    if (!validTime(d.startTime)) errors.startTime = 'Enter a time like 14:30, or leave it blank.';
    else if (d.outreachDate === today && eventTs(d) > Date.now()) errors.startTime = 'That start time hasn’t happened yet.';
  }
  const area = state.areas.find(a => a.id === d.areaId);
  if (!clean(d.areaId)) errors.areaId = 'Choose an area.';
  else if (!area || !area.active) errors.areaId = 'That area isn’t available any more. Choose another.';
  if (!OUTREACH_TYPES.some(t => t.key === d.typeKey)) errors.typeKey = 'Choose the type of outreach.';
  const myTeams = myActiveTeamIds(state, actor.id);
  let deptId = clean(d.departmentId);
  if (!myTeams.length) { if (deptId) errors.departmentId = 'You’re not on that team.'; deptId = ''; }
  else if (!deptId && myTeams.length === 1) deptId = myTeams[0];
  else if (!deptId) errors.departmentId = 'Choose which team this session is for.';
  else if (myTeams.indexOf(deptId) === -1) errors.departmentId = 'You can only record sessions for your own teams.';
  // Anyone listed gains access to the session, so they must be active evangelists on the same team.
  const participants = [actor.id];
  [].concat(d.participantIds || []).forEach(id => {
    if (id === actor.id || participants.indexOf(id) !== -1) return;
    const u = getUser(state, id);
    if (u && u.status === 'active' && u.role === 'evangelist' && deptId && deptIdsOf(state, id).indexOf(deptId) !== -1) participants.push(id);
    else errors.participantIds = 'One of the people you chose can’t be added to this session.';
  });
  if (String(d.notes || '').length > LIMITS.sessionNotes) errors.notes = 'Keep the notes under ' + LIMITS.sessionNotes + ' characters.';
  if (people.length > LIMITS.peoplePerSession) errors.people = 'One session can hold up to ' + LIMITS.peoplePerSession + ' people. Save this one, then record the rest in a second session.';
  const inScope = personIdsInScope(state, actor), seenExisting = {};
  people.forEach((c, i) => {
    const pe = {};

    allowed: (state, actor, e) => actor.role === 'team_leader' || (e.recordedBy === actor.id && withinWindow(e.recordedAt)),

/* ---------- services: every change checks the actor first ---------- */
async function authenticate(state, email, password) {
  const generic = { ok: false, error: 'We couldn’t sign you in. Check your email and password, or ask an administrator for help.' };
  const u = findUserByEmail(state, email);
  if (!u || !u.passwordHash || u.status !== 'active') {
    await pbkdf2(String(password || ''), new Uint8Array(16), APP.iterations); // keep timing similar
    return generic;
  }
  if (!(await verifyPassword(password, u.passwordHash))) return generic;
  u.lastLoginAt = Date.now();
  return { ok: true, user: u };
}

async function makeInvitation(userId, actorId) {
  const code = newInviteCode();
  const now = Date.now();
  const record = { id: uid('i'), userId: userId, codeHash: await sha256Hex(normaliseCode(code)), createdAt: now, expiresAt: now + APP.inviteDays * DAY, usedAt: null, revokedAt: null, createdBy: actorId };
  return { code: code, record: record };
}
function revokeOpenInvitations(state, userId) {
  state.invitations.forEach(i => { if (i.userId === userId && !i.usedAt && !i.revokedAt) i.revokedAt = Date.now(); });
}

async function inviteUser(state, actorId, data) {
  const actor = getUser(state, actorId);
  if (!can(actor, 'users.manage')) return FORBIDDEN;
  const errors = {};
  const nameErr = validateName(data.name); if (nameErr) errors.name = nameErr;
  const emailErr = validateEmail(data.email);
  if (emailErr) errors.email = emailErr;
  else if (findUserByEmail(state, data.email)) errors.email = 'An account with this email address already exists.';
  if (!ROLES[data.role]) errors.role = 'Choose a role.';
  if (Object.keys(errors).length) return { ok: false, errors: errors };
  const deptIds = (data.departmentIds || []).filter(id => state.departments.some(d => d.id === id && d.active));
  const user = { id: uid('u'), email: String(data.email).trim().toLowerCase(), name: String(data.name).trim(), role: data.role, status: 'invited', passwordHash: null, createdAt: Date.now(), lastLoginAt: null, invitedBy: actor.id };
  const inv = await makeInvitation(user.id, actor.id);
  // all or nothing: nothing is written until every step above has succeeded
  state.users.push(user);
  deptIds.forEach(id => state.memberships.push({ userId: user.id, departmentId: id }));
  state.invitations.push(inv.record);
  return { ok: true, user: user, code: inv.code, expiresAt: inv.record.expiresAt };
}

async function reissueInvitation(state, actorId, userId) {
  const actor = getUser(state, actorId);
  if (!can(actor, 'users.manage')) return FORBIDDEN;
  const target = getUser(state, userId);
  if (!target) return { ok: false, error: 'That user no longer exists.' };
  if (target.id === actor.id) return { ok: false, error: 'You can’t reset your own access.' };
  if (target.status === 'deactivated') return { ok: false, error: 'Reactivate this account before issuing a new code.' };
  const inv = await makeInvitation(target.id, actor.id);
  revokeOpenInvitations(state, target.id);
  target.passwordHash = null;
  target.status = 'invited';
  state.invitations.push(inv.record);
  return { ok: true, user: target, code: inv.code, expiresAt: inv.record.expiresAt };
}

async function activateWithCode(state, email, code, password) {
  const generic = { ok: false, error: 'That email and invitation code don’t match, or the invitation has expired. Ask an administrator for a new code.' };

  if (!u || u.status !== 'invited') return generic;
  const inv = latestInvitation(state, u.id);
  if (!inv || inv.usedAt || inv.expiresAt <= Date.now()) return generic;
  const hash = await sha256Hex(normaliseCode(code));
  if (!constantTimeEqual(hash, inv.codeHash)) return generic;
  if (passwordRules(password, { email: u.email }).some(r => !r.ok)) return { ok: false, field: 'password', error: 'Your password doesn’t meet all the requirements yet.' };
  u.passwordHash = await hashPassword(password);
  u.status = 'active';
  inv.usedAt = Date.now();
  return { ok: true, user: u };
}

function updateUser(state, actorId, userId, data) {
  const actor = getUser(state, actorId);
  if (!can(actor, 'users.manage')) return FORBIDDEN;
  const target = getUser(state, userId);
  if (!target) return { ok: false, error: 'That user no longer exists.' };
  const nameErr = validateName(data.name);
  if (nameErr) return { ok: false, field: 'name', error: nameErr };
  if (!ROLES[data.role]) return { ok: false, field: 'role', error: 'Choose a role.' };
  const roleChanged = data.role !== target.role;
  if (roleChanged && target.id === actor.id) return { ok: false, field: 'role', error: 'You can’t change your own role.' };
  if (roleChanged && target.role === 'admin' && target.status === 'active' && activeAdmins(state).length <= 1) return { ok: false, field: 'role', error: 'At least one active administrator is required.' };
  const from = target.role;
  target.name = String(data.name).trim();
  target.role = data.role;
  const chosen = (data.departmentIds || []).filter(id => state.departments.some(d => d.id === id && d.active));
  const keepInactive = state.memberships.filter(m => m.userId === target.id && state.departments.some(d => d.id === m.departmentId && !d.active));
  state.memberships = state.memberships.filter(m => m.userId !== target.id)
    .concat(keepInactive)
    .concat(chosen.map(id => ({ userId: target.id, departmentId: id })));
  return { ok: true, user: target, roleChanged: roleChanged, from: from };
}

function setUserStatus(state, actorId, userId, status) {
  const actor = getUser(state, actorId);
  if (!can(actor, 'users.manage')) return FORBIDDEN;
  const target = getUser(state, userId);
  if (!target) return { ok: false, error: 'That user no longer exists.' };
  if (target.id === actor.id) return { ok: false, error: 'You can’t deactivate your own account.' };
  if (status === 'deactivated') {
    if (target.status === 'deactivated') return { ok: true, user: target };
    if (target.role === 'admin' && target.status === 'active' && activeAdmins(state).length <= 1) return { ok: false, error: 'At least one active administrator is required.' };
    target.status = 'deactivated';
    revokeOpenInvitations(state, target.id);
    return { ok: true, user: target };
  }
  if (status === 'active') {
    if (target.status !== 'deactivated') return { ok: true, user: target };
    target.status = target.passwordHash ? 'active' : 'invited';
    return { ok: true, user: target };
  }
  return { ok: false, error: 'Unknown status.' };
}

function addDepartment(state, actorId, name) {
  if (!can(getUser(state, actorId), 'settings.manage')) return FORBIDDEN;
  const err = validateLabel(name, 'team'); if (err) return { ok: false, error: err };
  const n = String(name).trim();
  if (state.departments.some(d => d.name.toLowerCase() === n.toLowerCase())) return { ok: false, error: 'A team with this name already exists.' };
  const d = { id: uid('d'), name: n, description: '', active: true };
  state.departments.push(d);
  return { ok: true, department: d };
}
function renameDepartment(state, actorId, deptId, name) {
  if (!can(getUser(state, actorId), 'settings.manage')) return FORBIDDEN;
  const d = state.departments.find(x => x.id === deptId); if (!d) return { ok: false, error: 'That team no longer exists.' };
  const err = validateLabel(name, 'team'); if (err) return { ok: false, error: err };
  const n = String(name).trim();
  if (state.departments.some(x => x.id !== d.id && x.name.toLowerCase() === n.toLowerCase())) return { ok: false, error: 'A team with this name already exists.' };
  d.name = n; return { ok: true, department: d };
}
function setDepartmentActive(state, actorId, deptId, active) {
  if (!can(getUser(state, actorId), 'settings.manage')) return FORBIDDEN;
  const d = state.departments.find(x => x.id === deptId); if (!d) return { ok: false, error: 'That team no longer exists.' };
  d.active = !!active; return { ok: true, department: d };
}
function setChurchName(state, actorId, name) {
  if (!can(getUser(state, actorId), 'settings.manage')) return FORBIDDEN;
  const err = validateLabel(name, 'church'); if (err) return { ok: false, error: err };
  state.settings.churchName = String(name).trim(); return { ok: true };
}

/* ---------- reports: metric definitions, periods and scoped queries ----------
   buildReport is the only place a report figure is calculated. The dashboard, the report pages, the charts, their table views and
   the CSV export all read its result, so a number can never be counted two ways. In Django this becomes a small reports service of
   scoped aggregates (Count with distinct=True). Its result holds counts and labels only: no person's name, id or contact detail. */
const REPORT_GROUPS = [
  { key: 'outreach', label: 'Outreach activity' },
  { key: 'followup', label: 'Follow-up' },
  { key: 'progress', label: 'Attendance and integration' },
  { key: 'now',      label: 'Right now' }
];
// Draft definitions. They are written down so a chart and a report can never disagree, and Kharis leadership should confirm them.
// basis 'period' follows the date range. basis 'now' describes today and ignores it.
const METRICS = [
  { key: 'sessions', group: 'outreach', basis: 'period', label: 'Sessions', short: 'Outreach sessions held in the period.',
    long: 'Sessions whose outreach date falls in the period. The date is when the outreach happened, not when it was entered. Archived sessions are left out.' },
  { key: 'encounters', group: 'outreach', basis: 'period', label: 'Encounters', short: 'Each recorded meeting with a person.',
    long: 'One for every person listed in a session. Someone met in three sessions is three encounters. This measures how much outreach happened, not how many different people were met.' },
  { key: 'peopleReached', group: 'outreach', basis: 'period', label: 'People reached', short: 'Different people met at least once.',
    long: 'Distinct people with at least one encounter in the period. Someone met three times counts once, whichever team or session they were met in.' },
  { key: 'newPeople', group: 'outreach', basis: 'period', label: 'New to us', short: 'People met for the first time.',
    long: 'People reached in the period whose first recorded encounter, anywhere in the data this report covers, falls in the period. Everyone else had been met before.' },
  { key: 'flagged', group: 'outreach', basis: 'period', label: 'Flagged for follow-up', short: 'People an evangelist suggested following up.',
    long: 'Distinct people with at least one encounter in the period marked “follow-up suggested”. A suggestion is not a case, and nobody is contacted until a leader opens one.' },
  { key: 'decisions', group: 'outreach', basis: 'period', label: 'Decisions recorded', short: 'People with a decision noted.',
    long: 'Distinct people with a decision noted on an encounter (by its outreach date) or on a follow-up contact (by its contact date) in the period. A decision is an outcome that people record. It is never a pipeline stage and never a score.' },
  { key: 'casesOpened', group: 'followup', basis: 'period', label: 'Cases opened', short: 'Follow-up cases opened in the period.',
    long: 'Follow-up cases whose opening date falls in the period, for the teams selected.' },
  { key: 'attempts', group: 'followup', basis: 'period', label: 'Contact attempts', short: 'Calls, messages and visits logged by follow-up.',
    long: 'Every follow-up contact in the period where someone reached out: unanswered calls, messages left and real conversations. Seeing someone at church without speaking to them is not an attempt.' },
  { key: 'conversations', group: 'followup', basis: 'period', label: 'Follow-ups completed', short: 'Attempts that ended in a conversation.',
    long: 'Follow-up contacts in the period where the person was actually spoken with. That includes “not interested right now” and “asked us not to contact them again”. Unanswered calls, messages left and numbers that didn’t work are not included.' },
  { key: 'peopleSpoken', group: 'followup', basis: 'period', label: 'People spoken with', short: 'Different people with a completed follow-up.',
    long: 'Distinct people with at least one completed follow-up in the period. Two conversations with the same person count once here and twice in Follow-ups completed.' },
  { key: 'attended', group: 'progress', basis: 'period', label: 'Attended church', short: 'People with attendance recorded after outreach.',
    long: 'Distinct people with attendance recorded on a follow-up contact in the period, either because they told us they came or because we saw them there. Someone with both counts once, as seen. This is people we follow up, not general church attendance.' },
  { key: 'integration', group: 'progress', basis: 'period', label: 'Moving towards integration', short: 'People whose case reached Integration in progress or Integrated.',
    long: 'Distinct people whose follow-up case moved to Integration in progress or to Integrated during the period. It reads the stage history, so a later move back does not undo it.' },
  { key: 'integrated', group: 'progress', basis: 'period', label: 'Integrated', short: 'People whose case reached Integrated.',
    long: 'Distinct people whose follow-up case moved to the Integrated stage during the period.' },
  { key: 'dueNow', group: 'now', basis: 'now', label: 'Follow-ups due', short: 'Open cases whose next contact date is today or has passed.',
    long: 'Open cases (not Integrated or Closed) whose next contact date is today or earlier. It describes today, so it ignores the date range.' },
  { key: 'openNow', group: 'now', basis: 'now', label: 'Open cases', short: 'Cases not yet Integrated or Closed.',
    long: 'Every case that is not Integrated or Closed, for the teams selected. It describes today, so it ignores the date range.' },
  { key: 'stagesNow', group: 'now', basis: 'now', label: 'Cases by stage', short: 'Where every case stands today.',
    long: 'Every case for the teams selected, placed at its current stage. Each case is counted once. It describes today, so it ignores the date range.' },
  { key: 'unassignedNow', group: 'now', basis: 'now', label: 'Not assigned', short: 'Open cases with nobody looking after them.',
    long: 'Open cases that have no one assigned. It describes today, so it ignores the date range.' },
  { key: 'noNextStepNow', group: 'now', basis: 'now', label: 'No next step planned', short: 'Open cases without a next contact date.',
    long: 'Open cases that have no date for the next contact, so nothing will prompt anyone to follow up. It describes today, so it ignores the date range.' },
  { key: 'flaggedNoCaseNow', group: 'now', basis: 'now', label: 'Flagged, no case yet', short: 'People flagged for follow-up without a case.',
    long: 'People an evangelist flagged who have no open case and no case opened since the flag was raised. They are waiting for a leader to decide. It describes today, so it ignores the date range.' }
];
const metricInfo = key => METRICS.find(m => m.key === key) || { key: key, label: key, short: '', long: '', basis: 'period', group: 'outreach' };

const REPORT_PRESETS = [
  { key: '7d',     label: 'Last 7 days' },
  { key: '30d',    label: 'Last 30 days' },
  { key: '90d',    label: 'Last 90 days' },
  { key: 'year',   label: 'This year' },
  { key: 'all',    label: 'All time' },
  { key: 'custom', label: 'Custom range' }
];
const MONTH_SHORT = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MAX_REPORT_DAYS = 1830;
const newReportFilter = () => ({ preset: '90d', from: '', to: '', team: 'all', area: 'all' });
const reportFilterIsDefault = f => !!f && f.preset === '90d' && f.team === 'all' && f.area === 'all';
const dayDiff = (a, b) => Math.round((parseIsoDate(b) - parseIsoDate(a)) / DAY);
function addDays(iso, n) { const d = parseIsoDate(iso); d.setDate(d.getDate() + n); return isoDate(d.getTime()); }
function dayMon(iso) { const d = parseIsoDate(iso); return d ? d.getDate() + ' ' + MONTH_SHORT[d.getMonth()] : ''; }
function dayMonYear(iso) { const d = parseIsoDate(iso); return d ? d.getDate() + ' ' + MONTH_SHORT[d.getMonth()] + ' ' + d.getFullYear() : ''; }

// Turns the chosen period into real dates, or says what is wrong with it. "All time" starts at the earliest record the report can see.
function resolveRange(f, today, earliest) {
  const p = REPORT_PRESETS.find(x => x.key === (f && f.preset));
  if (!p) return { ok: false, error: 'Choose a period.' };
  let from, to = today;
  if (p.key === '7d') from = addDays(today, -6);
  else if (p.key === '30d') from = addDays(today, -29);
  else if (p.key === '90d') from = addDays(today, -89);
  else if (p.key === 'year') from = today.slice(0, 4) + '-01-01';
  else if (p.key === 'all') from = earliest && earliest <= today ? earliest : today;
  else {
    const a = clean(f.from), b = clean(f.to);
    if (!a || !b) return { ok: false, error: 'Choose both a start date and an end date.' };
    if (!parseIsoDate(a) || !parseIsoDate(b)) return { ok: false, error: 'Enter valid dates.' };
    if (b > today) return { ok: false, error: 'The end date can’t be in the future.' };
    if (a > b) return { ok: false, error: 'The start date is after the end date.' };
    from = a; to = b;
  }
  const days = dayDiff(from, to) + 1;
  if (days > MAX_REPORT_DAYS) return { ok: false, error: 'Choose a period of up to 5 years.' };
  return { ok: true, preset: p.key, from: from, to: to, days: days, label: dayMonYear(from) + ' – ' + dayMonYear(to) };
}

// Days up to 3 weeks, weeks (Monday to Sunday) up to 20 weeks, months beyond that. The first and last bucket are cut to the period.
function reportBuckets(from, to) {
  const span = dayDiff(from, to) + 1, unit = span <= 21 ? 'day' : span <= 140 ? 'week' : 'month', buckets = [];
  const crossYears = from.slice(0, 4) !== to.slice(0, 4);
  let cur = from;
  while (cur <= to) {
    const d = parseIsoDate(cur); let end, label, long;
    if (unit === 'day') { end = cur; label = dayMon(cur); long = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }).format(d); }
    else if (unit === 'week') { end = addDays(cur, 6 - ((d.getDay() + 6) % 7)); if (end > to) end = to; label = dayMon(cur); long = cur === end ? dayMon(cur) : dayMon(cur) + ' – ' + dayMon(end); }
    else { end = isoDate(new Date(d.getFullYear(), d.getMonth() + 1, 0).getTime()); if (end > to) end = to; label = MONTH_SHORT[d.getMonth()] + (crossYears ? ' ' + String(d.getFullYear()).slice(2) : ''); long = MONTH_LONG[d.getMonth()] + ' ' + d.getFullYear(); }
    buckets.push({ start: cur, end: end, label: label, long: long });
    cur = addDays(end, 1);
  }
  return { unit: unit, buckets: buckets };
}

// Who may be counted, and which teams a report can be split by. Pastors count the whole church, team leaders only their own teams.
const REPORT_SCOPE = { team_leader: 'team', pastor: 'church' };
function reportScope(state, actor) {
  const kind = actor && actor.status === 'active' ? REPORT_SCOPE[actor.role] : null;
  if (!kind) return null;
  const mine = deptIdsOf(state, actor.id), inDept = id => kind === 'church' || (!!id && mine.indexOf(id) !== -1);
  const sessionIds = {};
  if (kind === 'church') state.sessions.forEach(s => { if (!s.archived) sessionIds[s.id] = true; });
  else scopeSessionIds(state, actor).forEach(id => { sessionIds[id] = true; });
  const hasData = id => state.sessions.some(s => sessionIds[s.id] && s.departmentId === id) || state.cases.some(c => c.departmentId === id);
  const teams = state.departments.filter(d => inDept(d.id) && (d.active || hasData(d.id))).map(d => ({ id: d.id, name: d.name + (d.active ? '' : ' (inactive)'), hasSessions: state.sessions.some(s => sessionIds[s.id] && s.departmentId === d.id), hasCases: state.cases.some(c => c.departmentId === d.id) }));
  return { kind: kind, inDept: inDept, sessionIds: sessionIds, teams: teams, label: kind === 'church' ? 'Whole church' : teams.map(t => t.name).join(', ') || 'No team' };
}

// People flagged for follow-up in these sessions who have no open case and no case opened since the flag was raised.
// The pipeline's suggestion queue and the report's “flagged, no case yet” both come from here, so they always agree.
function flaggedWithoutCase(state, sidSet, personIds) {
  const byS = {}; state.sessions.forEach(s => { byS[s.id] = s; });
  const pool = {};
  if (personIds) personIds.forEach(id => { pool[id] = true; });
  else state.encounters.forEach(e => { if (sidSet[e.sessionId]) pool[e.personId] = true; });
  const out = [];
  Object.keys(pool).forEach(pid => {
    const p = state.people.find(x => x.id === pid); if (!p || p.archived) return;
    if (openCaseFor(state, pid)) return;
    const lastOpened = state.cases.filter(c => c.personId === pid).reduce((m, c) => Math.max(m, c.openedAt), 0);
    const flagged = state.encounters.filter(e => e.personId === pid && e.followUpSuggested && sidSet[e.sessionId] && e.recordedAt > lastOpened)
      .sort((a, b) => eventTs(byS[b.sessionId]) - eventTs(byS[a.sessionId]));
    if (flagged.length) out.push({ personId: pid, flagged: flagged });
  });
  return out;
}

const uniqKeys = arr => { const m = {}; arr.forEach(x => { m[x] = 1; }); return Object.keys(m); };

function buildReport(state, actorId, filters, needCap) {
  const actor = getUser(state, actorId);
  if (!can(actor, needCap || 'reports.view')) return FORBIDDEN;
  const sc = reportScope(state, actor); if (!sc) return FORBIDDEN;
  const f = Object.assign(newReportFilter(), filters || {});
  // A team or location the viewer can’t reach looks exactly like one that doesn’t exist.
  if (f.team !== 'all' && !sc.teams.some(t => t.id === f.team)) return { ok: false, code: 404, error: 'We couldn’t find that team.' };
  if (f.area !== 'all' && !state.areas.some(a => a.id === f.area)) return { ok: false, code: 404, error: 'We couldn’t find that location.' };
  const today = isoDate(Date.now()), teamOk = id => f.team === 'all' || id === f.team;

  const scopeSessions = state.sessions.filter(s => sc.sessionIds[s.id] && teamOk(s.departmentId));
  const cases = state.cases.filter(c => sc.inDept(c.departmentId) && teamOk(c.departmentId));
  const caseById = {}; cases.forEach(c => { caseById[c.id] = c; });
  const allContacts = state.contacts.filter(k => caseById[k.caseId]);
  const allStageEvents = state.caseEvents.filter(ev => ev.kind === 'stage' && caseById[ev.caseId]);

  let earliest = '';
  if (f.preset === 'all') earliest = scopeSessions.map(s => s.outreachDate).concat(allContacts.map(k => k.contactDate), allStageEvents.map(e => isoDate(e.at)), cases.map(c => isoDate(c.openedAt))).filter(Boolean).sort()[0] || '';
  const R = resolveRange(f, today, earliest);
  if (!R.ok) return { ok: false, code: 400, error: R.error, field: 'range' };
  const inR = d => d >= R.from && d <= R.to;

  // Outreach: sessions in the period (and area), their encounters, and the people behind them.
  const sess = scopeSessions.filter(s => inR(s.outreachDate) && (f.area === 'all' || s.areaId === f.area));
  const sessById = {}; sess.forEach(s => { sessById[s.id] = s; });
  const encs = state.encounters.filter(e => sessById[e.sessionId]);
  const dateOf = {}; state.sessions.forEach(s => { dateOf[s.id] = s.outreachDate; });
  const firstMet = {};
  state.encounters.forEach(e => { if (!sc.sessionIds[e.sessionId]) return; const d = dateOf[e.sessionId]; if (!firstMet[e.personId] || d < firstMet[e.personId]) firstMet[e.personId] = d; });
  const people = uniqKeys(encs.map(e => e.personId));
  const flaggedPeople = uniqKeys(encs.filter(e => e.followUpSuggested).map(e => e.personId));

  // Follow-up: contacts and stage moves in the period, for the cases of the teams selected.
  const cons = allContacts.filter(k => inR(k.contactDate));
  const kindOf = k => outcomeInfo(k.outcome).kind;
  const reachedOut = cons.filter(k => kindOf(k) === 'attempt' || kindOf(k) === 'conversation');
  const talked = cons.filter(k => kindOf(k) === 'conversation');
  const personOfContact = k => caseById[k.caseId].personId;
  const attendance = {};
  cons.forEach(k => {
    const a = kindOf(k) === 'attendance' ? 'recorded' : k.attendance;
    if (a !== 'recorded' && a !== 'reported') return;
    const p = personOfContact(k); if (a === 'recorded' || !attendance[p]) attendance[p] = a;
  });
  const seen = Object.keys(attendance).filter(p => attendance[p] === 'recorded').length, told = Object.keys(attendance).length - seen;
  const decisionPeople = uniqKeys(encs.filter(e => e.response === 'decision').map(e => e.personId).concat(cons.filter(k => k.response === 'decision').map(personOfContact)));
  const moves = allStageEvents.filter(ev => inR(isoDate(ev.at)));
  const personOfEvent = ev => caseById[ev.caseId].personId;
  const integrationPeople = uniqKeys(moves.filter(ev => ev.to === 'integrating' || ev.to === 'integrated').map(personOfEvent));
  const integratedPeople = uniqKeys(moves.filter(ev => ev.to === 'integrated').map(personOfEvent));
  const opened = cases.filter(c => inR(isoDate(c.openedAt)));

  // Today, whatever the period: open cases, who is late, and who is waiting for a decision.
  const open = cases.filter(c => isOpenStage(c.stage)), dueKind = c => dueInfo(c, today).kind;
  const sidForFlags = {}; scopeSessions.forEach(s => { sidForFlags[s.id] = true; });
  const now = { open: open.length, overdue: open.filter(c => dueKind(c) === 'overdue').length, dueToday: open.filter(c => dueKind(c) === 'today').length,
    unassigned: open.filter(c => !c.assigneeId).length, noNextStep: open.filter(c => !c.nextContactDate).length, flaggedNoCase: flaggedWithoutCase(state, sidForFlags).length };
  now.due = now.overdue + now.dueToday;
  const stages = STAGES.map(s => ({ key: s.key, label: s.label, count: cases.filter(c => c.stage === s.key).length }));

  // Over time.
  const bk = reportBuckets(R.from, R.to), nb = bk.buckets.length;
  const idx = d => { for (let i = 0; i < nb; i++) if (d >= bk.buckets[i].start && d <= bk.buckets[i].end) return i; return -1; };
  const series = bk.buckets.map(b => ({ start: b.start, end: b.end, label: b.label, long: b.long, sessions: 0, encounters: 0, people: 0, attempts: 0, conversations: 0, notReached: 0, newPeople: 0, returning: 0, attended: 0, integrating: 0, integrated: 0 }));
  const sets = series.map(() => ({ people: {}, attended: {}, integrating: {}, integrated: {} }));
  sess.forEach(s => { const i = idx(s.outreachDate); if (i >= 0) series[i].sessions++; });
  encs.forEach(e => { const i = idx(dateOf[e.sessionId]); if (i < 0) return; series[i].encounters++; sets[i].people[e.personId] = 1; });
  cons.forEach(k => {
    const i = idx(k.contactDate); if (i < 0) return;
    if (kindOf(k) === 'attempt' || kindOf(k) === 'conversation') series[i].attempts++;
    if (kindOf(k) === 'conversation') series[i].conversations++;
    if (kindOf(k) === 'attendance' || k.attendance === 'recorded' || k.attendance === 'reported') sets[i].attended[personOfContact(k)] = 1;
  });
  moves.forEach(ev => { const i = idx(isoDate(ev.at)); if (i < 0) return; if (ev.to === 'integrating' || ev.to === 'integrated') sets[i].integrating[personOfEvent(ev)] = 1; if (ev.to === 'integrated') sets[i].integrated[personOfEvent(ev)] = 1; });
  series.forEach((b, i) => { const ids = Object.keys(sets[i].people); b.people = ids.length; b.newPeople = ids.filter(p => firstMet[p] >= b.start).length; b.returning = b.people - b.newPeople; b.attended = Object.keys(sets[i].attended).length; b.integrating = Object.keys(sets[i].integrating).length; b.integrated = Object.keys(sets[i].integrated).length; b.notReached = b.attempts - b.conversations; });

  // By team: teams that have recorded anything, in name order. It is a picture of activity, not a league table.
  const teamRows = sc.teams.filter(t => (f.team === 'all' || t.id === f.team) && (t.hasSessions || t.hasCases)).map(t => {
    const ts = sess.filter(s => s.departmentId === t.id), tIds = {}; ts.forEach(s => { tIds[s.id] = true; });
    const te = encs.filter(e => tIds[e.sessionId]), tc = cases.filter(c => c.departmentId === t.id), tcIds = {}; tc.forEach(c => { tcIds[c.id] = true; });

    const att = {}; tk.forEach(k => { if (kindOf(k) === 'attendance' || k.attendance === 'recorded' || k.attendance === 'reported') att[personOfContact(k)] = 1; });
    return { id: t.id, name: t.name, sessions: ts.length, encounters: te.length, people: uniqKeys(te.map(e => e.personId)).length, flagged: uniqKeys(te.filter(e => e.followUpSuggested).map(e => e.personId)).length,
      casesOpened: tc.filter(c => inR(isoDate(c.openedAt))).length, conversations: tk.filter(k => kindOf(k) === 'conversation').length, attended: Object.keys(att).length,
      integration: uniqKeys(tm.filter(ev => ev.to === 'integrating' || ev.to === 'integrated').map(personOfEvent)).length, open: topen.length, overdue: topen.filter(c => dueKind(c) === 'overdue').length };
  }).sort((a, b) => a.name.localeCompare(b.name));
  const noTeam = sess.filter(s => !s.departmentId);
  if (noTeam.length && f.team === 'all') { const ids = {}; noTeam.forEach(s => { ids[s.id] = true; }); const te = encs.filter(e => ids[e.sessionId]);
    teamRows.push({ id: '', name: 'No team', sessions: noTeam.length, encounters: te.length, people: uniqKeys(te.map(e => e.personId)).length, flagged: uniqKeys(te.filter(e => e.followUpSuggested).map(e => e.personId)).length,
      casesOpened: 0, conversations: 0, attended: 0, integration: 0, open: 0, overdue: 0 }); }

  // By location and by response.
  const areaRows = state.areas.map(a => {
    const as = sess.filter(s => s.areaId === a.id), ids = {}; as.forEach(s => { ids[s.id] = true; });
    const ae = encs.filter(e => ids[e.sessionId]);
    return { id: a.id, name: a.name + (a.active ? '' : ' (inactive)'), sessions: as.length, encounters: ae.length, people: uniqKeys(ae.map(e => e.personId)).length };
  }).filter(r => r.sessions > 0).sort((a, b) => b.encounters - a.encounters || a.name.localeCompare(b.name));
  const responseRows = RESPONSES.map(r => ({ key: r.key, label: r.label, count: encs.filter(e => (e.response || 'not_recorded') === r.key).length }));

  // The sessions themselves, newest first. No names: only counts and where it happened.
  const canLink = can(actor, 'sessions.view');
  const sessionRows = sess.slice().sort((a, b) => eventTs(b) - eventTs(a) || b.enteredAt - a.enteredAt).map(s => {
    const se = encs.filter(e => e.sessionId === s.id), area = state.areas.find(a => a.id === s.areaId), team = state.departments.find(d => d.id === s.departmentId);
    const row = { date: s.outreachDate, time: s.startTime || '', area: area ? area.name : 'Unknown area', team: team ? team.name : 'No team', type: typeLabel(s.typeKey), encounters: se.length, flagged: se.filter(e => e.followUpSuggested).length };
    if (canLink) row.id = s.id;
    return row;
  });

  const notes = [];
  if (f.area !== 'all') notes.push('Follow-up figures can’t be split by location, so they cover every location for the teams selected.');
  const teamsInScope = sc.teams.map(t => ({ id: t.id, name: t.name }));
  const areasInScope = state.areas.filter(a => a.active || state.sessions.some(s => sc.sessionIds[s.id] && s.areaId === a.id)).map(a => ({ id: a.id, name: a.name + (a.active ? '' : ' (inactive)') }));
  const quietTeams = state.departments.filter(d => d.active && sc.inDept(d.id) && !sc.teams.some(t => t.id === d.id && (t.hasSessions || t.hasCases))).length;

  return { ok: true, filters: { preset: R.preset, from: f.from, to: f.to, team: f.team, area: f.area }, range: { from: R.from, to: R.to, days: R.days, label: R.label },
    unit: bk.unit, scope: { kind: sc.kind, label: sc.label, teams: teamsInScope, areas: areasInScope, quietTeams: quietTeams },
    totals: { sessions: sess.length, encounters: encs.length, peopleReached: people.length, newPeople: people.filter(p => firstMet[p] >= R.from).length, flagged: flaggedPeople.length, decisions: decisionPeople.length,
      casesOpened: opened.length, attempts: reachedOut.length, conversations: talked.length, notReached: reachedOut.length - talked.length, peopleSpoken: uniqKeys(talked.map(personOfContact)).length,
      attended: seen + told, attendedSeen: seen, attendedTold: told, integration: integrationPeople.length, integrated: integratedPeople.length },
    now: now, stages: stages, series: series, teams: teamRows, areas: areaRows, responses: responseRows, sessions: sessionRows, notes: notes,
    empty: !sess.length && !cons.length && !moves.length && !opened.length };
}

/* ---------- reports: tables and CSV ----------
   Every chart has a table twin and every table can be exported. They are all made here, from the same report, so they match. */
function reportTables(rep) {
  const perPeriod = rep.unit === 'day' ? 'Day' : rep.unit === 'week' ? 'Week' : 'Month';
  const t = {};
  t.activity = { title: 'Outreach activity over time', cols: [['period', perPeriod], ['sessions', 'Sessions'], ['encounters', 'Encounters'], ['people', 'Different people met']],
    rows: rep.series.map(b => ({ period: b.long, sessions: b.sessions, encounters: b.encounters, people: b.people })),
    note: 'Different people are counted within each ' + perPeriod.toLowerCase() + ', so someone met in two weeks appears in both. The rows add up to more than People reached for the whole period.' };
  t.people = { title: 'People reached over time', cols: [['period', perPeriod], ['newPeople', 'New to us'], ['returning', 'Met before'], ['people', 'Different people met']],
    rows: rep.series.map(b => ({ period: b.long, newPeople: b.newPeople, returning: b.returning, people: b.people })),
    note: 'Different people are counted within each ' + perPeriod.toLowerCase() + '. “New to us” means their first recorded meeting was in that ' + perPeriod.toLowerCase() + '.' };
  t.teams = { title: 'By team', cols: [['name', 'Team'], ['sessions', 'Sessions'], ['encounters', 'Encounters'], ['people', 'People reached'], ['conversations', 'Follow-ups completed'], ['attended', 'Attended church'], ['integration', 'Moving towards integration'], ['open', 'Open cases now'], ['overdue', 'Overdue now']],
    rows: rep.teams, note: 'Teams are listed by name, not ranked. They differ in size and in the kind of outreach they do.' };
  t.areas = { title: 'By location', cols: [['name', 'Location'], ['sessions', 'Sessions'], ['encounters', 'Encounters'], ['people', 'People reached']], rows: rep.areas };
  const total = rep.totals.encounters || 0;
  t.responses = { title: 'Responses recorded', cols: [['label', 'Response'], ['count', 'Encounters'], ['share', 'Share']],
    rows: rep.responses.map(r => ({ label: r.label, count: r.count, share: total ? Math.round(r.count * 100 / total) + '%' : '0%' })), note: 'Each encounter has one response. People can be met more than once, so these count encounters, not people.' };
  t.sessions = { title: 'Sessions in this period', cols: [['date', 'Date'], ['area', 'Location'], ['team', 'Team'], ['type', 'Type'], ['encounters', 'People met'], ['flagged', 'Flagged for follow-up']], rows: rep.sessions };
  t.contacts = { title: 'Follow-up contacts over time', cols: [['period', perPeriod], ['conversations', 'Conversations'], ['notReached', 'Tried, didn’t reach'], ['attempts', 'All attempts']],
    rows: rep.series.map(b => ({ period: b.long, conversations: b.conversations, notReached: b.notReached, attempts: b.attempts })) };
  t.stages = { title: 'Cases by stage, right now', cols: [['label', 'Stage'], ['count', 'Cases']], rows: rep.stages };
  t.attendance = { title: 'Attendance outcomes', cols: [['label', 'Outcome'], ['count', 'People']],
    rows: [{ label: 'We saw them at church', count: rep.totals.attendedSeen }, { label: 'They told us they came', count: rep.totals.attendedTold }], note: 'Each person is counted once. Someone we saw and who also told us counts as seen.' };
  t.milestones = { title: 'Milestones over time', cols: [['period', perPeriod], ['attended', 'Attended church'], ['integrating', 'Reached integration'], ['integrated', 'Integrated']],
    rows: rep.series.map(b => ({ period: b.long, attended: b.attended, integrating: b.integrating, integrated: b.integrated })),
    note: 'People are counted within each ' + perPeriod.toLowerCase() + '. “Reached integration” includes people who went on to Integrated.' };
  t.summary = { title: 'Summary of figures', cols: [['metric', 'Figure'], ['value', 'Value'], ['how', 'How it is counted']],
    rows: ['sessions', 'encounters', 'peopleReached', 'newPeople', 'flagged', 'decisions', 'casesOpened', 'attempts', 'conversations', 'peopleSpoken', 'attended', 'integration', 'integrated'].map(k => ({ metric: metricInfo(k).label, value: rep.totals[k], how: metricInfo(k).long }))
      .concat([['dueNow', rep.now.due], ['openNow', rep.now.open], ['unassignedNow', rep.now.unassigned], ['noNextStepNow', rep.now.noNextStep], ['flaggedNoCaseNow', rep.now.flaggedNoCase]].map(p => ({ metric: metricInfo(p[0]).label + ' (right now)', value: p[1], how: metricInfo(p[0]).long }))) };
  const isNum = v => typeof v === 'number' || /^\d+%$/.test(String(v));
  Object.keys(t).forEach(k => { t[k].id = k; t[k].cols = t[k].cols.map(c => ({ key: c[0], label: c[1], num: t[k].rows.length > 0 && isNum(t[k].rows[0][c[0]]) })); });
  return t;
}
// A spreadsheet treats a cell that starts with = + - or @ as a formula. Prefixing a quote keeps names and notes as plain text.
function csvCell(v) {
  let s = v == null ? '' : String(v);
  if (typeof v === 'string' && /^[=+\-@\t\r]/.test(s)) s = '\'' + s;
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function reportCsv(rep, tableId) {
  const t = reportTables(rep)[tableId]; if (!t) return '';
  return [t.cols.map(c => csvCell(c.label)).join(',')].concat(t.rows.map(r => t.cols.map(c => csvCell(r[c.key])).join(','))).join('\r\n') + '\r\n';
}
const reportFileName = (rep, tableId) => 'kharis-outreach-' + tableId + '-' + rep.range.from + '-to-' + rep.range.to + '.csv';

/* ---------- reports: charts ----------
   Charts are drawn here as inline SVG and plain HTML, coloured only through CSS tokens, so light and dark mode need no redraw.
   Every chart has a table twin built from the same report. In the Django build these become Chart.js charts fed by the same figures. */
const nf = n => new Intl.NumberFormat('en-GB').format(n);
// Smallest tidy ceiling for a count axis, with at most five steps, so the gridlines fall on whole numbers.
function niceAxis(max) {
  if (max <= 4) return { top: 4, step: 1 };
  const steps = [1, 2, 5, 10, 20, 25, 50, 100, 200, 250, 500, 1000, 2000, 5000, 10000];
  const step = steps.find(s => Math.ceil(max / s) <= 5) || 20000;
  return { top: Math.ceil(max / step) * step, step: step };
}
// Columns over time. One series, or a stack. Bars are never wider than 24px, round only at the top, and stacked segments are
// separated by a 2px gap of the surface colour. Each column has a wide invisible hit area that carries the tooltip.
// spec: { title, stacked, series: [{ key, label, cls }], buckets: [{ label, long, values }] }
function vizColumnsSvg(spec, W) {
  const H = W < 520 ? 224 : 264, m = { t: 12, r: 8, b: 30, l: 36 }, pw = W - m.l - m.r, ph = H - m.t - m.b, n = spec.buckets.length;
  const sums = spec.buckets.map(b => spec.stacked ? spec.series.reduce((s, x) => s + (b.values[x.key] || 0), 0) : Math.max.apply(null, spec.series.map(x => b.values[x.key] || 0)));
  const ax = niceAxis(Math.max.apply(null, sums.concat([0]))), y = v => m.t + ph - (v / ax.top) * ph, band = pw / n, bw = Math.max(3, Math.min(24, band * 0.62));
  let g = '';
  for (let v = 0; v <= ax.top; v += ax.step) g += '<line class="' + (v === 0 ? 'viz-base' : 'viz-grid') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"/><text class="viz-tick" x="' + (m.l - 8) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + nf(v) + '</text>';
  const longest = Math.max.apply(null, spec.buckets.map(b => b.label.length)), every = Math.max(1, Math.ceil((longest * 6.4 + 14) / band));
  let bars = '', labels = '', hits = '';
  spec.buckets.forEach((b, i) => {
    const cx = m.l + band * i + band / 2, x = cx - bw / 2;
    if (i % every === 0) labels += '<text class="viz-tick" x="' + cx.toFixed(1) + '" y="' + (H - 10) + '" text-anchor="middle">' + esc(b.label) + '</text>';
    let acc = 0; const live = spec.series.filter(s => (b.values[s.key] || 0) > 0);
    spec.series.forEach(s => {
      const v = b.values[s.key] || 0; if (!v) return;
      const y1 = y(acc + v), y0 = y(acc), top = live[live.length - 1] === s, gap = spec.stacked && acc > 0 ? 1 : 0, hgt = Math.max(1, y0 - y1 - (spec.stacked && !top ? 1 : 0) - gap);
      const yy = y1 + (spec.stacked && !top ? 1 : 0) + (top ? 0 : 0), r = top ? Math.min(4, hgt / 2, bw / 2) : 0;
      bars += '<path class="viz-bar ' + s.cls + '" d="M' + x.toFixed(1) + ' ' + (yy + hgt).toFixed(1) + 'V' + (yy + r).toFixed(1) + (r ? 'Q' + x.toFixed(1) + ' ' + yy.toFixed(1) + ' ' + (x + r).toFixed(1) + ' ' + yy.toFixed(1) + 'H' + (x + bw - r).toFixed(1) + 'Q' + (x + bw).toFixed(1) + ' ' + yy.toFixed(1) + ' ' + (x + bw).toFixed(1) + ' ' + (yy + r).toFixed(1) : 'H' + (x + bw).toFixed(1)) + 'V' + (yy + hgt).toFixed(1) + 'Z"/>';
      if (spec.stacked) acc += v;
    });
    const text = b.long + ': ' + spec.series.map(s => (b.values[s.key] || 0) + ' ' + s.label.toLowerCase()).join(', ');
    hits += '<rect class="viz-hit" x="' + (m.l + band * i).toFixed(1) + '" y="' + m.t + '" width="' + band.toFixed(1) + '" height="' + ph + '" tabindex="' + (i === 0 ? 0 : -1) + '" role="img" aria-label="' + esc(text) + '" data-tip="' +
      esc(JSON.stringify({ t: b.long, r: spec.series.map(s => [s.cls, s.label, b.values[s.key] || 0]) })) + '"/>';
  });
  return '<svg class="viz-svg" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="group" aria-label="' + esc(spec.title + '. Use the arrow keys to move between columns, or open the table below.') + '">' + g + bars + labels + '<g class="viz-hits">' + hits + '</g></svg>';
}
function colsChart(spec) {

// Bars from a baseline, one per row, with the value at the tip. Used for categories, so all bars share one colour unless the rows are ordered stages.
function hbarsHtml(rows, opts) {

  const act = { title: 'Encounters per ' + rep.unit, stacked: false, series: [{ key: 'encounters', label: 'Encounters', cls: 's1' }], buckets: rep.series.map(b => ({ label: b.label, long: b.long, values: { encounters: b.encounters } })) };
  return { t: t, act: act };
}
function stageRows(rep) {
  return rep.stages.map((s, i) => ({ label: s.label, value: s.count, cls: s.key === 'closed' ? 'stc' : 'st' + (i + 1) }));
}
function stageChart(rep, t) {
  return chartCard({ title: 'Follow-up pipeline', sub: 'Where every case stands today. The period doesn’t change this.', table: t.stages, body: hbarsHtml(stageRows(rep), { label: 'Cases by stage' }),
    summary: plural(rep.now.open, 'case is', 'cases are') + ' open, and ' + (n => n + (n === 1 ? ' case has' : ' cases have'))(rep.stages.find(s => s.key === 'integrated').count) + ' reached Integrated.' });
}
function teamsChart(rep, t) {
  if (rep.teams.length < 2) return '';
  return chartCard({ title: 'Outreach by team', sub: 'Encounters in the period, by the team that recorded them.', table: t.teams, body: hbarsHtml(rep.teams.map(r => ({ label: r.name, value: r.encounters })), { label: 'Encounters by team' }),
    summary: rep.scope.quietTeams ? plural(rep.scope.quietTeams, 'team hasn’t', 'teams haven’t') + ' recorded any outreach yet.' : '' });
}
function areasChart(rep, t) {
  if (!rep.areas.length) return '';
  return chartCard({ title: 'Outreach by location', sub: 'Encounters in the period, by where the session took place.', table: t.areas, body: hbarsHtml(rep.areas.map(r => ({ label: r.name, value: r.encounters })), { label: 'Encounters by location' }) });
}
function responsesChart(rep, t) {
  const rows = rep.responses.filter(r => r.count > 0 || r.key !== 'not_recorded');
  const total = rep.totals.encounters;
  return chartCard({ title: 'What people said', sub: 'The response noted at each encounter in the period. A label chosen by the evangelist, never a score.', table: t.responses,
    body: hbarsHtml(rows.map(r => ({ label: r.label, value: r.count, sub: total ? Math.round(r.count * 100 / total) + '%' : '' })), { label: 'Responses recorded' }) });
}
// Things that are slipping right now. Team leaders get a link to the cases; the pastor sees the counts and nothing that identifies anyone.
function behindCard(user, rep) {
  const link = can(user, 'followup.view');
  const items = [['overdue', rep.now.overdue, 'Overdue', 'Next contact date has passed.', 'due'], ['today', rep.now.dueToday, 'Due today', 'Next contact is planned for today.', 'due'],
    ['unassigned', rep.now.unassigned, 'Not assigned', 'Open cases with nobody looking after them.', 'unassigned'], ['nonext', rep.now.noNextStep, 'No next step planned', 'Open cases with no date to follow up.', 'nodate'],
    ['flagged', rep.now.flaggedNoCase, 'Flagged, no case yet', 'People an evangelist flagged who are waiting for a leader’s decision.', 'flagged']].filter(i => i[1] > 0);
  const body = items.length ? '<ul class="attn">' + items.map(i => '<li><span class="attn-n">' + nf(i[1]) + '</span><span class="attn-t"><strong>' + esc(i[2]) + '</strong><span class="muted">' + esc(i[3]) + '</span></span>' +
    (link ? '<button type="button" class="btn btn-secondary btn-sm" data-action="pipe-from-report" data-kind="' + i[4] + '" aria-label="Open ' + esc(i[2].toLowerCase()) + ' in the pipeline">Open</button>' : '') + '</li>').join('') + '</ul>'
    : '<p class="calm">' + icon('check', 18) + '<span>Nothing is falling behind right now.</span></p>';
  return '<section class="card"><div class="chart-head"><div><h2>Where follow-up is falling behind</h2><p class="muted">Right now. The period doesn’t change this.</p></div></div>' + body +
    (!link ? '<p class="scope-note">Counts only. Team leaders can open the cases behind each figure.</p>' : '') + '</section>';
}
function recentSessionsCard(user, rep, limit) {

    const main = esc(fmtDay(r.date)) + ' · ' + esc(r.area);
    return '<li><div class="grow">' + (link && r.id ? '<button type="button" class="link" data-action="open-session" data-id="' + esc(r.id) + '">' + main + '</button>' : '<strong>' + main + '</strong>') +
      '<br><span class="muted">' + esc(r.type) + ' · ' + esc(r.team) + ' · ' + plural(r.encounters, 'person', 'people') + ' met' + (r.flagged ? ' · ' + r.flagged + ' flagged' : '') + '</span></div></li>';
  }).join('') + '</ul>' : '<p class="muted">No sessions in this period.</p>';
