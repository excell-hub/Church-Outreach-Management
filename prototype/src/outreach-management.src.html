function scriptureCard() {
  return '<figure class="card scripture-card scripture"><blockquote>As we have therefore opportunity, let us do good unto all men, especially unto them who are of the household of faith.</blockquote><figcaption>Galatians 6:10 (KJV)</figcaption></figure>';
}
function noTeamCard() {
  return '<section class="card empty-block"><h2>You are not on a team yet</h2><p>Ask an administrator to add you to a team. Your team’s figures will appear here once it has recorded outreach.</p></section>';
}

function dashboardBody(user, rep) {
  if (!rep.ok) return '';
  if (rep.scope.kind === 'team' && !rep.scope.teams.length) return noTeamCard();
  const T = rep.totals, t = reportTables(rep), pastor = rep.scope.kind === 'church';
  const tiles = '<div class="kpis">' + kpiTile('People reached', T.peopleReached, plural(T.newPeople, 'person', 'people') + ' new to us, from ' + plural(T.encounters, 'encounter', 'encounters') + '.', { hero: true }) +
    kpiTile('Follow-ups completed', T.conversations, 'Conversations, from ' + plural(T.attempts, 'contact attempt', 'contact attempts') + '.') +
    kpiTile('Decisions recorded', T.decisions, 'Different people, noted by us.') +
    kpiTile('Attended church', T.attended, 'People with attendance recorded.') +
    kpiTile('Towards integration', T.integration, 'Reached Integration in progress or Integrated.') +
    kpiTile('Follow-ups due', rep.now.due, 'Open cases due today or overdue.', { now: true }) + '</div>';
  if (rep.empty && !rep.now.open && !rep.now.flaggedNoCase) return tiles + emptyPeriodCard(rep) + scriptureCard();
  const act = activityCharts(rep);
  const activity = !T.sessions ? noOutreachCard(rep) : chartCard({ title: 'Outreach activity over time', sub: 'Encounters recorded each ' + rep.unit + '. Someone met twice counts twice here.', table: t.activity,
    body: colsChart(act.act), summary: peakSentence(rep, 'encounters', { one: 'encounter', many: 'encounters' }) });
  const pairA = '<div class="grid-eq">' + stageChart(rep, t) + behindCard(user, rep) + '</div>';
  // Everything else flows into rows of two. A lone card at the end spans the row instead of leaving a gap.
  const cards = [teamsChart(rep, t), areasChart(rep, t), responsesChart(rep, t), recentSessionsCard(user, rep, 5)].filter(Boolean);
  let rest = '';
  for (let i = 0; i < cards.length; i += 2) rest += cards.length - i === 1 ? cards[i] : '<div class="grid-eq">' + cards[i] + cards[i + 1] + '</div>';
  const teamTable = pastor && rep.teams.length > 1 ? '<section class="card"><h2>Team overview</h2><p class="muted">Each team’s activity in the period and its open follow-up today. Listed by name, not ranked: teams differ in size and in the kind of outreach they do.</p>' + vizTableOpen(t.teams) + '</section>' : '';
  const foot = '<div class="grid-eq">' + scriptureCard() + '<section class="card"><h2>How the figures are counted</h2><p class="muted">Every figure here has a written definition. Someone met three times is three encounters but one person, and an unanswered call is an attempt, not a completed follow-up.</p>' +
    '<p style="margin-top:12px"><button type="button" class="btn btn-secondary btn-sm" data-action="open-definitions">Read the definitions</button></p></section></div>';
  return tiles + activity + pairA + rest + teamTable + foot;
}
// A table that is the content rather than a twin of a chart, so it starts open.
function vizTableOpen(t) { return vizTableHtml(t).replace('<details class="viz-table">', '<details class="viz-table" open>').replace('<summary>View as a table</summary>', '<summary>Table</summary>'); }

const REPORT_TABS = [['activity', 'Outreach activity'], ['followup', 'Follow-up'], ['progress', 'Attendance and integration'], ['definitions', 'How figures are counted']];
function reportsTabsHtml() {
  return '<div class="seg seg-wrap" role="group" aria-label="Choose a report">' + REPORT_TABS.map(x => '<button type="button" class="seg-btn" data-action="rep-tab" data-tab="' + x[0] + '" aria-pressed="' + (ui.reportTab === x[0] ? 'true' : 'false') + '">' + esc(x[1]) + '</button>').join('') + '</div>';
}
function definitionsHtml() {
  return '<section class="card"><h2>How the figures are counted</h2><p class="muted">These are the definitions the dashboard, the reports, the charts and the exports all use. They are drafts until Kharis leadership confirms them. A single person can have many encounters and many follow-up contacts, so each figure says whether it counts records or different people.</p></section>' +
    REPORT_GROUPS.map(g => '<section class="card"><h2>' + esc(g.label) + '</h2>' + (g.key === 'now' ? '<p class="muted">These describe today and ignore the period you choose.</p>' : '') + '<dl class="dl" style="margin-top:12px">' +

function reportsBody(user, rep) {

  const T = rep.totals, t = reportTables(rep), tab = ui.reportTab;

    const tiles = '<div class="kpis">' + kpiTile('Sessions', T.sessions, metricInfo('sessions').short) + kpiTile('Encounters', T.encounters, metricInfo('encounters').short) + kpiTile('People reached', T.peopleReached, metricInfo('peopleReached').short, { hero: true }) +
      kpiTile('New to us', T.newPeople, metricInfo('newPeople').short) + kpiTile('Flagged for follow-up', T.flagged, metricInfo('flagged').short) + kpiTile('Decisions recorded', T.decisions, metricInfo('decisions').short) + '</div>';
    if (!T.sessions) return tiles + noOutreachCard(rep);

      vizTableOpen(Object.assign({}, t.sessions, { rows: rep.sessions.slice(0, 60), note: rep.sessions.length > 60 ? 'Showing the newest 60. Export to get every row.' : '' })) + '</section>' : '';
    return tiles + chartCard({ title: 'Outreach activity over time', sub: 'Encounters recorded each ' + rep.unit + '. Someone met twice counts twice here.', table: t.activity, body: colsChart(act), summary: peakSentence(rep, 'encounters', { one: 'encounter', many: 'encounters' }) }) +
      chartCard({ title: 'People reached over time', sub: 'Different people met each ' + rep.unit + ', split into those new to us and those met before.', table: t.people, legend: legendHtml(ppl.series), body: colsChart(ppl), summary: peakSentence(rep, 'people', { one: 'person', many: 'people' }) }) +
      '<div class="grid-eq">' + teamsChart(rep, t) + areasChart(rep, t) + '</div>' + responsesChart(rep, t) + sessionsTable;
  }
  if (tab === 'followup') {
    const tiles = '<div class="kpis">' + kpiTile('Cases opened', T.casesOpened, metricInfo('casesOpened').short) + kpiTile('Contact attempts', T.attempts, metricInfo('attempts').short) + kpiTile('Follow-ups completed', T.conversations, metricInfo('conversations').short, { hero: true }) +
      kpiTile('People spoken with', T.peopleSpoken, metricInfo('peopleSpoken').short) + kpiTile('Open cases', rep.now.open, metricInfo('openNow').short, { now: true }) + kpiTile('Follow-ups due', rep.now.due, metricInfo('dueNow').short, { now: true }) + '</div>';
    const con = { title: 'Follow-up contacts per ' + rep.unit, stacked: true, series: [{ key: 'conversations', label: 'Conversations', cls: 's1' }, { key: 'notReached', label: 'Tried, didn’t reach', cls: 'sg' }],
      buckets: rep.series.map(b => ({ label: b.label, long: b.long, values: { conversations: b.conversations, notReached: b.notReached } })) };
    const contactsChart = T.attempts ? chartCard({ title: 'Follow-up contacts over time', sub: 'Every attempt in the period, split by whether we reached the person.', table: t.contacts, legend: legendHtml(con.series), body: colsChart(con),
      summary: T.conversations + ' of ' + T.attempts + (T.attempts === 1 ? ' attempt' : ' attempts') + ' ended in a conversation.' })
      : '<section class="card empty-block"><h2>No follow-up contacts in this period</h2><p>Contact attempts will appear here as follow-up is recorded.</p></section>';
    return tiles + contactsChart + '<div class="grid-eq">' + stageChart(rep, t) + behindCard(user, rep) + '</div>' +
      (rep.teams.length > 1 ? '<section class="card"><h2>Follow-up by team</h2><p class="muted">Listed by name, not ranked.</p>' + vizTableOpen(t.teams) + '</section>' : '');
  }
  const tiles = '<div class="kpis">' + kpiTile('Attended church', T.attended, metricInfo('attended').short, { hero: true }) + kpiTile('Towards integration', T.integration, metricInfo('integration').short) + kpiTile('Integrated', T.integrated, metricInfo('integrated').short) + '</div>';

  const att = { rows: [{ label: 'We saw them at church', value: T.attendedSeen }, { label: 'They told us they came', value: T.attendedTold }] };
  const mile = [{ label: 'Attended church', value: T.attended, cls: 'st4' }, { label: 'Reached integration', value: T.integration, cls: 'st5' }, { label: 'Integrated', value: T.integrated, cls: 'st6' }];
  const milTable = Object.assign({}, t.milestones);

      summary: 'Each person is counted once. Someone we saw and who also told us counts as seen.' }) +

function reportRootHtml(user, mode) {

  const rep = buildReport(state, user.id, ui.report, cap);
  const noteHtml = rep.ok && rep.notes.length ? '<p class="scope-note">' + rep.notes.map(esc).join(' ') + '</p>' : '';
  const body = mode === 'dashboard' ? dashboardBody(user, rep) : reportsBody(user, rep);

  return (mode === 'reports' ? reportsTabsHtml() : '') + (showFilters ? '<div class="rep-bar">' + rangeBarHtml(user, rep) + noteHtml + '</div>' : '') + '<div class="stack rep-body">' + body + '</div>';

function countByStatus() {
  const c = { active: 0, invited: 0, deactivated: 0 };
  state.users.forEach(u => { const k = displayStatus(state, u).key; if (k === 'active') c.active++; else if (k === 'deactivated') c.deactivated++; else c.invited++; });
  return c;
}
function filteredUsers() {
  const f = ui.usersFilter; const q = f.q.trim().toLowerCase();
  return state.users.filter(u => {
    if (q && u.name.toLowerCase().indexOf(q) === -1 && u.email.toLowerCase().indexOf(q) === -1) return false;
    if (f.role !== 'all' && u.role !== f.role) return false;
    if (f.status !== 'all') { const k = displayStatus(state, u).key; if (f.status === 'invited' ? (k !== 'invited' && k !== 'expired') : k !== f.status) return false; }
    return true;
  }).sort((a, b) => a.name.localeCompare(b.name));
}

  }).join('') + '</div>' :

function mergeDialogHtml(user, aId, bId) {
  if (!can(user, 'people.merge')) return null;
  const rows = personRows(state, user), ra = rows.find(r => r.id === aId), rb = rows.find(r => r.id === bId);
  if (!ra || !rb) return null;
  const a = duplicateSide(state, user, ra), b = duplicateSide(state, user, rb);
  const keepFirst = a.timesMet > b.timesMet || (a.timesMet === b.timesMet && a.firstMetDate <= b.firstMetDate);
  const opt = (s, checked) => '<label class="radio-card"><input type="radio" name="keepId" value="' + esc(s.id) + '"' + (checked ? ' checked' : '') + '><span><strong>Keep ' + esc(s.name) + '</strong><br><span class="muted">Met ' + plural(s.timesMet, 'time', 'times') + ' · first ' + esc(fmtDay(s.firstMetDate)) + '</span></span></label>';
  return dlgShell({ title: 'Merge these records?', form: 'merge', attrs: ' data-a="' + esc(aId) + '" data-b="' + esc(bId) + '"',
    body: '<p>Choose the record to keep. Everything recorded about the other one moves across.</p><div class="field" style="margin-top:12px"><span class="label">Record to keep</span>' + opt(a, keepFirst) + opt(b, !keepFirst) + '</div>' +
      '<ul class="ticks"><li>' + icon('check') + '<span>All meetings, contacts and case history move to the kept record. Nothing is deleted.</span></li>' +
      '<li>' + icon('check') + '<span>If the kept record has no phone or email, the other one’s details are copied across, but only if they were shared freely.</span></li>' +
      '<li>' + icon('alert') + '<span>The other record is retired and its contact details are cleared. <strong>This can’t be undone in this prototype.</strong></span></li></ul>' +
      '<p class="form-error" data-form-error role="alert" hidden></p>',
    foot: '<button type="button" class="btn btn-secondary" data-action="dlg-close">Cancel</button><button type="submit" class="btn btn-danger" data-busy-label="Merging…">Merge records</button>' });
}

/* ---------- the guided recorder: draft, steps and cards ----------
   The draft lives only in memory (ui.draft). Every input writes into it as you type, and every screen is drawn from it,
   so moving between steps or adding a person never loses what you entered. */
const DRAFT_PATH = /^(session\.(outreachDate|startTime|areaId|typeKey|departmentId|notes)|people\.\d{1,2}\.(name|phone|email|voluntary|response|followUp|notes|query))$/;
const SESSION_FIELDS = ['outreachDate', 'startTime', 'areaId', 'typeKey', 'departmentId', 'participantIds', 'notes'];
function newDraft(user) {
  const teams = myActiveTeamIds(state, user.id);
  return { key: uid('sub'), step: 1, submitting: false, banner: '', errors: { session: {}, people: [] },
    session: { outreachDate: isoDate(Date.now()), startTime: '', areaId: '', typeKey: '', departmentId: teams.length === 1 ? teams[0] : '', participantIds: [], notes: '' }, people: [] };
}
function newPersonCard() { return { mode: 'new', existingId: '', query: '', name: '', phone: '', email: '', voluntary: false, response: 'not_recorded', followUp: false, notes: '', dupDismissed: false }; }
function draftInput(d) { return { submissionKey: d.key, session: d.session, people: d.people }; }
function draftHasContent(d) { const s = d && d.session; return !!(d && (d.people.length || s.areaId || s.typeKey || clean(s.notes) || s.startTime || s.participantIds.length)); }
function setDraftPath(d, path, value) {
  if (!d || !DRAFT_PATH.test(path)) return false;
  const parts = path.split('.');
  if (parts[0] === 'session') { d.session[parts[1]] = value; return true; }
  const c = d.people[+parts[1]]; if (!c) return false;
  c[parts[2]] = value; return true;
}
function toggleParticipant(d, id, on) {
  const list = d.session.participantIds, i = list.indexOf(id);
  if (on && i === -1) list.push(id); else if (!on && i !== -1) list.splice(i, 1);
}
function clearDraftError(d, path) {
  const parts = path.split('.');
  if (parts[0] === 'session') { delete d.errors.session[parts[1]]; return; }
  const pe = d.errors.people[+parts[1]]; if (!pe) return;
  delete pe[parts[2]]; if (parts[2] === 'phone' || parts[2] === 'email') delete pe.voluntary; if (parts[2] === 'query') delete pe.existing;
}

<script id="app">
'use strict';
/* =====================================================================
   APP: storage, events and DOM updates. Everything else lives above.
   ===================================================================== */
const STORE_KEY = 'outreach-management-proto-v1', SESSION_KEY = 'outreach-management-proto-session';
const dlg = document.getElementById('dlg'), toasts = document.getElementById('toasts'), rootEl = document.getElementById('root');
let pendingConfirm = null;

/* ---------- storage ---------- */
function loadState() {
  try { const raw = localStorage.getItem(STORE_KEY); if (!raw) return null; const s = upgradeState(JSON.parse(raw)); return isValidState(s) ? s : null; }
  catch (e) { ui.storageOK = false; return null; }
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); ui.storageOK = true; }
  catch (e) { ui.storageOK = false; }
  return ui.storageOK;
}
function saveSession() { try { if (sessionUserId) sessionStorage.setItem(SESSION_KEY, sessionUserId); else sessionStorage.removeItem(SESSION_KEY); } catch (e) { /* session lasts until reload */ } }

/* ---------- rendering ---------- */
function render() {
  let user = currentUser();
  if (sessionUserId && !user) endSession('Your session ended because your account is no longer active. Ask an administrator if this is unexpected.', 'warn');
  user = currentUser();
  document.body.classList.toggle('in-app', !!user);
  document.body.classList.toggle('in-login', !user);
  rootEl.innerHTML = user ? viewShell(user) : (ui.screen === 'activate' ? viewActivate() : viewLogin());
  if (ui.focusMain) { const h = document.getElementById('page-title'); if (h) h.focus(); ui.focusMain = false; }
  else if (ui.focusSel) { const el = document.querySelector(ui.focusSel); if (el) el.focus(); }
  ui.focusSel = null;
  hideChartTip(); drawCharts();
}
function startSession(user) {
  sessionUserId = user.id; saveSession(); resetWorkState();
  ui.page = landingPage(user); ui.forbidden = false; ui.navOpen = false; ui.menuOpen = false; ui.notice = null; ui.focusMain = true;
  render(); toast('Signed in as ' + user.name + '.');
}
function endSession(message, tone) {
  sessionUserId = null; saveSession(); resetWorkState();
  ui.screen = 'login'; ui.notice = message ? { tone: tone || 'good', text: message } : null; ui.navOpen = false; ui.menuOpen = false;
  closeDialog();
}
function go(pageId, params, flash) {
  const user = currentUser(); if (!user) return render();
  const g = guardPage(user, pageId);
  if (params && params.sessionId !== undefined) ui.sessionId = params.sessionId;
  if (params && params.personId !== undefined) ui.personId = params.personId;
  if (params && params.caseId !== undefined) ui.caseId = params.caseId;
  if (g.ok && pageId === 'record' && !ui.draft) ui.draft = newDraft(user);
  ui.flash = flash || null;
  ui.page = pageId; ui.forbidden = !g.ok; ui.navOpen = false; ui.menuOpen = false; ui.focusMain = true;
  render(); window.scrollTo(0, 0);
}
// Where a detail page should return to: the page the person was on when they opened it.
function backHere() {
  if (ui.page === 'session') return { label: 'the session', page: 'session', params: { sessionId: ui.sessionId } };
  if (ui.page === 'person') return { label: 'the profile', page: 'person', params: { personId: ui.personId } };
  if (ui.page === 'case') return { label: 'the case', page: 'case', params: { caseId: ui.caseId } };
  if (ui.page === 'pipeline') return { label: 'Follow-up Pipeline', page: 'pipeline' };
  if (ui.page === 'duplicates') return { label: 'Possible duplicates', page: 'duplicates' };
  if (ui.page === 'people') return { label: 'People', page: 'people' };
  if (ui.page === 'dashboard') return { label: 'Dashboard', page: 'dashboard' };
  if (ui.page === 'reports') return { label: 'Reports', page: 'reports' };
  return { label: 'Outreach Sessions', page: 'sessions' };
}

/* ---------- follow-up: saving, with the same all-or-nothing rule as the session recorder ---------- */
// Runs a service. If anything throws part-way, the state is restored from the snapshot, like a database rollback.
function atomic(fn) {
  const snapshot = JSON.stringify(state);
  try { return fn(); }
  catch (err) { console.error(err); state = JSON.parse(snapshot); return { ok: false, error: 'Something went wrong while saving. Nothing was saved.' }; }
}
// Shows a service's refusal on the form: field errors beside their fields, anything else as one message at the bottom.
function failForm(form, r) {
  if (!r.errors) { showFormError(form, r.error || 'Something went wrong. Nothing was saved.'); return; }
  const loose = [];
  Object.keys(r.errors).forEach(k => { if (k !== 'form' && form.querySelector('[data-err="' + k + '"]')) setFieldError(form, k, r.errors[k]); else loose.push(r.errors[k]); });
  if (loose.length) showFormError(form, loose.join(' '));
  focusFirstInvalid(form);
}
function syncContactForm(form, from) {
  const c = getCaseFor(state, sessionUserId, form.dataset.caseId); if (!c) return;
  const outcome = form.elements.outcome.value, o = CONTACT_OUTCOMES.find(x => x.key === outcome);
  const conv = form.querySelector('#ct-conv'), warn = form.querySelector('#ct-nocontact'), closeBox = form.querySelector('#ct-close'), stageEl = form.elements.stageTo;
  if (conv) {
    conv.hidden = !(o && o.kind === 'conversation');
    if (conv.hidden) { form.elements.response.value = ''; form.elements.attendance.value = ''; }
  }
  if (warn) warn.hidden = outcome !== 'asked_no_contact';
  if (from === 'outcome') {
    if (o && o.kind === 'attendance') form.elements.method.value = 'in_person';
    // The stage is only suggested. Once someone picks one themselves it is left alone.
    if (stageEl && !form.dataset.stageTouched) stageEl.value = suggestStage(c, outcome, form.elements.attendance.value);
  }
  if (closeBox && stageEl) closeBox.hidden = stageEl.value !== 'closed';
}
function syncStageForm(form) {
  const box = form.querySelector('#sg-close'); if (box) box.hidden = form.elements.to.value !== 'closed';
}
const caseAction = (user, id, cap) => {
  const c = user ? getCaseFor(state, user.id, id) : null;
  if (!c || !can(user, cap)) { toast('We couldn’t open that case.', 'bad'); return null; }
  return c;
};

/* ---------- the recorder: step changes and saving ---------- */
function draftNext() {
  const d = ui.draft, user = currentUser(); if (!d || !user) return;
  const v = validateSessionDraft(state, user, draftInput(d));
  d.errors.session = v.errors; d.banner = '';
  if (SESSION_FIELDS.some(k => v.errors[k])) { ui.focusSel = '[aria-invalid="true"]'; return render(); }
  d.step = 2; ui.focusMain = true; render(); window.scrollTo(0, 0);
}
function draftReview() {
  const d = ui.draft, user = currentUser(); if (!d || !user) return;
  const v = validateSessionDraft(state, user, draftInput(d));
  d.errors.session = v.errors; d.errors.people = v.personErrors; d.banner = '';
  if (SESSION_FIELDS.some(k => v.errors[k])) { d.step = 1; d.banner = 'Something in the session details needs attention.'; ui.focusSel = '[aria-invalid="true"]'; return render(); }
  if (v.errors.people || v.personErrors.some(pe => Object.keys(pe).length)) { ui.focusSel = '[aria-invalid="true"]'; return render(); }
  d.step = 3; ui.focusMain = true; render(); window.scrollTo(0, 0);
}
function submitSession() {
  const d = ui.draft, user = currentUser(); if (!d || !user || d.submitting) return;
  d.submitting = true; d.banner = '';
  const snapshot = JSON.stringify(state);           // lets us undo everything if anything goes wrong, like a database rollback
  let r;
  try { r = createSession(state, user.id, draftInput(d)); }
  catch (err) { console.error(err); state = JSON.parse(snapshot); r = { ok: false, error: 'Something went wrong while saving. Nothing was saved, and your draft is still here.' }; }
  d.submitting = false;
  if (!r.ok) {
    if (r.errors || r.personErrors) {
      d.errors = { session: r.errors || {}, people: r.personErrors || [] };
      d.step = SESSION_FIELDS.some(k => d.errors.session[k]) ? 1 : 2;
      d.banner = 'We couldn’t save this session. Check the highlighted fields. Nothing has been saved.'; ui.focusSel = '[aria-invalid="true"]';
    } else d.banner = r.error;
    return render();
  }
  const kept = r.duplicate ? true : saveState();
  ui.draft = null;
  const n = r.encounterCount;
  const msg = r.duplicate ? 'This session had already been saved, so nothing was added twice.' : 'Session saved with ' + plural(n, 'person', 'people') + (r.newPeople ? ' (' + r.newPeople + ' new)' : '') + '.';
  go('session', { sessionId: r.session.id }, { tone: 'good', text: msg + (kept ? '' : ' This browser is blocking storage, so it will be lost when you close the tab.') });
  toast(kept ? 'Session saved.' : 'Saved for this tab only.', kept ? 'good' : 'bad');
}
function syncNav() {
  const sb = document.getElementById('sidebar'), sc = document.querySelector('.scrim'), hb = document.getElementById('hamburger');
  if (sb) sb.classList.toggle('open', ui.navOpen);
  if (sc) sc.classList.toggle('show', ui.navOpen);
  if (hb) hb.setAttribute('aria-expanded', ui.navOpen ? 'true' : 'false');
  if (ui.navOpen) { const c = document.querySelector('.side-close'); if (c) c.focus(); } else if (hb && document.activeElement && document.activeElement.closest && document.activeElement.closest('#sidebar')) hb.focus();
}
function syncMenu() {
  const m = document.getElementById('account-menu'), b = document.getElementById('account-btn');
  if (m) m.hidden = !ui.menuOpen;
  if (b) b.setAttribute('aria-expanded', ui.menuOpen ? 'true' : 'false');
}

/* ---------- dialogs and toasts ---------- */
function openDialog(html) {
  dlg.innerHTML = html;
  if (!dlg.open) { if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', ''); }
  const body = dlg.querySelector('.dlg-body'); if (body) body.scrollTop = 0;
  const first = dlg.querySelector('[autofocus]') || dlg.querySelector('.dlg-body input, .dlg-body select, .dlg-body button') || dlg.querySelector('.dlg-foot .btn-primary');
  if (first) first.focus();
}
function closeDialog() { if (dlg.open) { if (typeof dlg.close === 'function') dlg.close(); else dlg.removeAttribute('open'); } }
dlg.addEventListener('close', () => { if (!dlg.open) { dlg.innerHTML = ''; pendingConfirm = null; } });
dlg.addEventListener('click', e => { if (e.target === dlg) closeDialog(); });
function toast(message, tone) {
  const t = tone || 'good';
  const el = document.createElement('div'); el.className = 'toast ' + t;
  el.innerHTML = icon(t === 'bad' ? 'alert' : 'check') + '<span>' + esc(message) + '</span>';
  toasts.appendChild(el); setTimeout(() => el.remove(), 5200);
}
function confirmThen(opts, fn) { pendingConfirm = fn; openDialog(confirmHtml(opts)); }

/* ---------- form helpers ---------- */
function readForm(form) {
  const out = {};
  new FormData(form).forEach((v, k) => { if (k in out) out[k] = [].concat(out[k], v); else out[k] = v; });
  return out;
}
function clearErrors(form) {
  form.querySelectorAll('[data-err]').forEach(e => { e.textContent = ''; });
  form.querySelectorAll('[aria-invalid]').forEach(e => e.removeAttribute('aria-invalid'));
  const fe = form.querySelector('[data-form-error]'); if (fe) { fe.hidden = true; fe.textContent = ''; }
}
function setFieldError(form, name, message) {
  const err = form.querySelector('[data-err="' + name + '"]'); const input = form.elements[name];
  if (err) err.textContent = message;
  if (input && input.setAttribute) { input.setAttribute('aria-invalid', 'true'); if (err && err.id) input.setAttribute('aria-describedby', err.id); }
}
function showFormError(form, message) { const fe = form.querySelector('[data-form-error]'); if (fe) { fe.textContent = message; fe.hidden = false; } else toast(message, 'bad'); }
function focusFirstInvalid(form) { const el = form.querySelector('[aria-invalid="true"]'); if (el) el.focus(); }
function setBusy(form, on) {
  const btn = form.querySelector('button[type="submit"]'); if (!btn) return;
  if (on) { form.dataset.busy = '1'; btn.disabled = true; btn.dataset.label = btn.innerHTML; btn.textContent = btn.dataset.busyLabel || 'Working…'; }
  else { delete form.dataset.busy; btn.disabled = false; if (btn.dataset.label) btn.innerHTML = btn.dataset.label; }
}

/* ---------- form handlers ---------- */
const handlers = {
  async login(form) {
    const d = readForm(form); clearErrors(form); let bad = false;
    if (!String(d.email || '').trim()) { setFieldError(form, 'email', 'Enter your email address.'); bad = true; }
    if (!d.password) { setFieldError(form, 'password', 'Enter your password.'); bad = true; }
    if (bad) return focusFirstInvalid(form);
    setBusy(form, true);
    const r = await authenticate(state, d.email, d.password);
    setBusy(form, false);
    if (!r.ok) { showFormError(form, r.error); form.elements.password.value = ''; form.elements.password.focus(); return; }
    saveState(); startSession(r.user);
  },
  async activate(form) {
    const d = readForm(form); clearErrors(form); let bad = false;
    const emailErr = validateEmail(d.email); if (emailErr) { setFieldError(form, 'email', emailErr); bad = true; }
    if (!normaliseCode(d.code)) { setFieldError(form, 'code', 'Enter the invitation code you were given.'); bad = true; }
    if (!d.password) { setFieldError(form, 'password', 'Choose a password.'); bad = true; }
    else if (d.password !== d.confirm) { setFieldError(form, 'confirm', 'The two passwords don’t match.'); bad = true; }
    if (bad) return focusFirstInvalid(form);
    setBusy(form, true);
    const r = await activateWithCode(state, d.email, d.code, d.password);
    setBusy(form, false);
    if (!r.ok) { if (r.field) { setFieldError(form, r.field, r.error); focusFirstInvalid(form); } else showFormError(form, r.error); return; }
    saveState(); ui.screen = 'login'; ui.prefillEmail = r.user.email; ui.notice = { tone: 'good', text: 'Your account is active. Sign in with your new password.' }; render();
  },
  async invite(form) {
    const d = readForm(form); d.departmentIds = [].concat(d.departmentIds || []); clearErrors(form);
    setBusy(form, true);
    const r = await inviteUser(state, sessionUserId, d);
    setBusy(form, false);
    if (!r.ok) {
      if (r.errors) { Object.keys(r.errors).forEach(k => setFieldError(form, k, r.errors[k])); focusFirstInvalid(form); } else showFormError(form, r.error);
      return;
    }
    saveState(); render(); openDialog(codeDialogHtml(r.user, r.code, r.expiresAt, 'Invitation created'));
  },
  async 'edit-user'(form) {
    const d = readForm(form); clearErrors(form);
    const id = form.dataset.userId; const target = getUser(state, id);
    if (!target) { closeDialog(); return toast('That user no longer exists.', 'bad'); }
    const data = { name: d.name, role: d.role || target.role, departmentIds: [].concat(d.departmentIds || []) };
    const nameErr = validateName(data.name); if (nameErr) { setFieldError(form, 'name', nameErr); return focusFirstInvalid(form); }
    if (data.role !== target.role) {
      return confirmThen({ title: 'Change role?', message: 'Change ' + target.name + '’s role from ' + ROLES[target.role].label + ' to ' + ROLES[data.role].label + '? This changes the pages and records they can reach straight away.', confirmLabel: 'Change role' }, () => applyEdit(id, data));
    }
    applyEdit(id, data);
  },
  'dept-add'(form) {
    const d = readForm(form); clearErrors(form);
    const r = addDepartment(state, sessionUserId, d.name);
    if (!r.ok) { setFieldError(form, 'name', r.error); return focusFirstInvalid(form); }
    saveState(); render(); toast('Added ' + r.department.name + '.');
  },
  'dept-rename'(form) {

    saveState(); closeDialog(); render(); toast('Team renamed to ' + r.department.name + '.');
  },
  'area-add'(form) {

    if (!r.ok) { setFieldError(form, 'name', r.error); return focusFirstInvalid(form); }
    saveState(); render(); toast('Added ' + r.area.name + '.');
  },
  'area-rename'(form) {

  'case-open'(form) {

  },
  'contact-add'(form) {
    const d = readForm(form); clearErrors(form);
    const r = atomic(() => recordContact(state, sessionUserId, form.dataset.caseId, Object.assign({}, d, { submissionKey: form.dataset.key })));
    if (!r.ok) return failForm(form, r);
    const kept = r.duplicate ? true : saveState(); closeDialog();
    const text = r.duplicate ? 'That contact had already been saved, so nothing was added twice.' : 'Contact saved' + (r.stageChanged ? ', and the case moved to ' + stageInfo(r.case.stage).label : '') + '.';
    go('case', { caseId: r.case.id }, { tone: 'good', text: text + (kept ? '' : ' This browser is blocking storage, so it will be lost when you close the tab.') });

  },
  'stage-change'(form) {
    const d = readForm(form); clearErrors(form);
    const r = atomic(() => changeStage(state, sessionUserId, form.dataset.caseId, d.to, { note: d.note, closeReason: d.closeReason }));
    if (!r.ok) return failForm(form, r);
    saveState(); closeDialog();
    go('case', { caseId: r.case.id }, { tone: 'good', text: 'Stage changed to ' + stageInfo(r.case.stage).label + '.' });
  },
  'case-assign'(form) {
    const d = readForm(form); clearErrors(form);
    const r = atomic(() => assignCase(state, sessionUserId, form.dataset.caseId, d.assigneeId));
    if (!r.ok) return failForm(form, r);
    saveState(); closeDialog();
    go('case', { caseId: r.case.id }, { tone: 'good', text: r.unchanged ? 'That person was already looking after this case.' : 'Assigned to ' + r.assignee.name + '.' });
  },
  'next-step'(form) {
    const d = readForm(form); clearErrors(form);
    const r = atomic(() => setNextStep(state, sessionUserId, form.dataset.caseId, { nextAction: d.nextAction, nextContactDate: d.nextContactDate }));
    if (!r.ok) return failForm(form, r);
    saveState(); closeDialog();
    go('case', { caseId: r.case.id }, { tone: 'good', text: 'Next step saved.' });
  },
  correct(form) {
    const d = readForm(form); clearErrors(form);
    const kind = form.dataset.kind, changes = Object.assign({}, d); delete changes.reason;
    // Unticked boxes are missing from the form data, so they are filled in here as false.
    if (kind === 'encounter') changes.followUpSuggested = 'followUpSuggested' in d;
    if (kind === 'person') changes.contactVoluntary = 'contactVoluntary' in d;
    const r = atomic(() => correctRecord(state, sessionUserId, kind, form.dataset.id, changes, d.reason));
    if (!r.ok) return failForm(form, r);
    saveState(); closeDialog(); render(); toast('Correction saved and logged.');
  },
  merge(form) {
    const d = readForm(form); clearErrors(form);
    const a = form.dataset.a, b = form.dataset.b;
    if (d.keepId !== a && d.keepId !== b) return showFormError(form, 'Choose the record to keep.');
    const r = atomic(() => mergePeople(state, sessionUserId, d.keepId, d.keepId === a ? b : a));
    if (!r.ok) return failForm(form, r);
    saveState(); closeDialog(); render();
    toast('Merged. ' + plural(r.encounters, 'meeting', 'meetings') + (r.cases ? ' and ' + plural(r.cases, 'case', 'cases') : '') + ' moved to ' + r.keep.name + '.');
  }
};
function applyEdit(id, data) {
  const r = updateUser(state, sessionUserId, id, data);
  closeDialog();
  if (!r.ok) return toast(r.error, 'bad');
  saveState(); render(); toast('Saved changes to ' + r.user.name + '.');
}
async function finishCode(r, heading) {
  if (!r.ok) { closeDialog(); return toast(r.error, 'bad'); }
  saveState(); render(); openDialog(codeDialogHtml(r.user, r.code, r.expiresAt, heading));
}

/* ---------- reports: charts, filters and export (browser side) ---------- */
let downloads = null, chartTipEl = null, chartResizeTimer = null;

// Charts are drawn to the width they have, so their text is never scaled. Safe to call often: a chart that already fits is left alone.
function drawCharts() {
  document.querySelectorAll('.viz-cols').forEach(box => {
    const w = Math.floor(box.clientWidth);
    if (w < 160 || box.dataset.w === String(w)) return;
    let spec; try { spec = JSON.parse(box.dataset.spec); } catch (e) { return; }
    box.dataset.w = String(w); box.innerHTML = vizColumnsSvg(spec, w);
  });
}
window.addEventListener('resize', () => { clearTimeout(chartResizeTimer); chartResizeTimer = setTimeout(() => { hideChartTip(); drawCharts(); }, 120); });

// One tooltip for every chart. It repeats what the table view says, and appears on hover, focus or tap.
function hideChartTip() { if (chartTipEl) chartTipEl.hidden = true; }
function showChartTip(target) {
  let d; try { d = JSON.parse(target.dataset.tip); } catch (e) { return hideChartTip(); }
  if (!chartTipEl) { chartTipEl = document.createElement('div'); chartTipEl.className = 'viz-tip'; chartTipEl.setAttribute('aria-hidden', 'true'); chartTipEl.hidden = true; document.body.appendChild(chartTipEl); }
  chartTipEl.innerHTML = '<p class="tip-t">' + esc(d.t) + '</p>' + d.r.map(r => '<p class="tip-r"><span class="key ' + esc(r[0]) + '"></span><span class="tip-l">' + esc(r[1]) + '</span><strong>' + nf(r[2]) + '</strong></p>').join('');
  chartTipEl.hidden = false;
  const b = target.getBoundingClientRect(), tw = chartTipEl.offsetWidth, th = chartTipEl.offsetHeight;
  let x = b.left + b.width / 2 - tw / 2, y = b.top + 8;
  x = Math.max(8, Math.min(x, window.innerWidth - tw - 8)); y = Math.max(8, Math.min(y, window.innerHeight - th - 8));
  chartTipEl.style.left = x + 'px'; chartTipEl.style.top = y + 'px';
}
document.addEventListener('mouseover', e => { const t = e.target.closest && e.target.closest('.viz-hit'); if (t) showChartTip(t); });
document.addEventListener('mouseout', e => { if (e.target.closest && e.target.closest('.viz-hit')) hideChartTip(); });
document.addEventListener('focusin', e => { const t = e.target.closest && e.target.closest('.viz-hit'); if (t) showChartTip(t); });
document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('.viz-hit')) hideChartTip(); });
document.addEventListener('pointerdown', e => { if (!(e.target.closest && e.target.closest('.viz-hit'))) hideChartTip(); });
document.addEventListener('scroll', hideChartTip, true);
// Arrow keys move between the columns of a chart, so the whole chart is one tab stop.
document.addEventListener('keydown', e => {
  const t = e.target; if (!t || !t.classList || !t.classList.contains('viz-hit')) return;
  const all = Array.from(t.parentNode.children), i = all.indexOf(t);
  let n;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') n = Math.min(all.length - 1, i + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') n = Math.max(0, i - 1);
  else if (e.key === 'Home') n = 0; else if (e.key === 'End') n = all.length - 1;
  else if (e.key === 'Escape') return hideChartTip();
  else return;
  e.preventDefault(); t.setAttribute('tabindex', '-1'); all[n].setAttribute('tabindex', '0'); all[n].focus();
});

// Redraws only the report area, so a filter change doesn’t reset the page or lose the scroll position.
function refreshReport(focusSel) {
  const user = currentUser(), root = document.getElementById('report-root');
  if (!user || !root || (ui.page !== 'dashboard' && ui.page !== 'reports')) return render();
  root.innerHTML = reportRootHtml(user, ui.page === 'reports' ? 'reports' : 'dashboard');
  hideChartTip(); drawCharts();
  if (focusSel) { const el = root.querySelector(focusSel); if (el) el.focus(); }
}
function onReportInput(t, kind) {
  const f = ui.report;
  if (kind === 'rep-preset') {
    f.preset = t.value;
    if (f.preset === 'custom' && (!f.from || !f.to)) { f.to = isoDate(Date.now()); f.from = addDays(f.to, -29); }
    return refreshReport('#rep-preset');
  }
  if (kind === 'rep-from' || kind === 'rep-to') { f[kind.slice(4)] = t.value; return refreshReport('#' + t.id); }
  if (kind === 'rep-team' || kind === 'rep-area') { f[kind.slice(4)] = t.value; return refreshReport('#' + t.id); }
}
// Hands the figure over to the pipeline as a ready-made filter. Only roles that may see cases get the button.
function openPipelineFor(user, kind) {
  if (!user || !can(user, 'followup.view')) return;
  const f = newPipeFilter();
  if (kind === 'due') f.due = 'due'; else if (kind === 'unassigned') f.assignee = 'none'; else if (kind === 'nodate') f.due = 'none';
  if (ui.report.team !== 'all') f.team = ui.report.team;
  ui.pipeFilter = f; ui.back = null; go('pipeline');
}
async function exportCsv(tableId) {
  const user = currentUser(); if (!user || !downloads) return;
  const rep = buildReport(state, user.id, ui.report, 'reports.view');
  const t = rep.ok ? reportTables(rep)[tableId] : null;
  if (!t) return toast('That export isn’t available. Check the period and filters.', 'bad');
  try {
    const r = await downloads.save({ filename: reportFileName(rep, tableId), data: reportCsv(rep, tableId) });
    if (r && r.status === 'saved') toast('Saved ' + t.title.toLowerCase() + ' as a CSV file.', 'good');
  } catch (err) {
    const code = err && err.code;
    if (code === 'declined') return;
    toast(code === 'rate_limited' ? 'Another download is waiting for you. Finish it first, then try again.' : 'We couldn’t save that file here.', 'bad');
  }
}
// The save capability may arrive late or never (for example outside Claude), so the page never waits for it. Export buttons appear only when it does.
async function resolveDownloads() {
  try {
    const d = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads') : null;
    if (!d) return;
    downloads = d; ui.canExport = true;
    if (ui.page === 'reports' && document.activeElement === document.body) render();
  } catch (e) { downloads = null; ui.canExport = false; }
}

/* ---------- events ---------- */
async function onClick(e) {

    case 'go-home': return user && go(landingPage(user));
    case 'toggle-nav': ui.navOpen = !ui.navOpen; return syncNav();

    }

    case 'clear-pick': { const i = +el.dataset.index, c = ui.draft && ui.draft.people[i]; if (!c) return; c.existingId = ''; ui.focusSel = '#pc' + i + '-q'; return render(); }
    case 'dup-use': {
      const i = +el.dataset.index, c = ui.draft && ui.draft.people[i]; if (!c) return;
      c.mode = 'existing'; c.existingId = id; c.query = ''; ui.focusSel = '[data-action="add-person"]'; return render();
    }
    case 'dup-dismiss': {
      const i = +el.dataset.index, c = ui.draft && ui.draft.people[i]; if (!c) return;
      c.dupDismissed = true; const box = document.getElementById('dup-' + i); if (box) box.innerHTML = ''; return;
    }
    case 'submit-session': return submitSession();
    case 'open-session': ui.back = backHere(); return go('session', { sessionId: id });
    case 'open-person': ui.back = backHere(); return go('person', { personId: id });
    case 'back-from': { const b = ui.back; ui.back = null; return b ? go(b.page, b.params) : go(el.dataset.page || (user && landingPage(user))); }
    case 'clear-session-filters': ui.sessionFilter = { area: 'all', type: 'all' }; return render();
    case 'clear-people-q': ui.peopleQ = ''; ui.peopleStage = 'all'; return render();
    case 'open-case-page': ui.back = backHere(); return go('case', { caseId: id });
    case 'open-case': { const html = user && openCaseDialogHtml(user, id); return html ? openDialog(html) : toast('We couldn’t find that person.', 'bad'); }
    case 'contact-open': { const c = caseAction(user, id, 'followup.record'); if (!c) return; if (!isOpenStage(c.stage)) return toast('This case is no longer open.', 'bad'); return openDialog(contactDialogHtml(user, c)); }
    case 'stage-open': { const c = caseAction(user, id, 'followup.record'); if (!c) return; openDialog(stageDialogHtml(user, c)); const f = dlg.querySelector('form'); if (f) syncStageForm(f); return; }
    case 'assign-open': { const c = caseAction(user, id, 'followup.assign'); return c && openDialog(assignDialogHtml(user, c)); }
    case 'nextstep-open': { const c = caseAction(user, id, 'followup.record'); if (!c) return; if (!isOpenStage(c.stage)) return toast('This case is no longer open.', 'bad'); return openDialog(nextStepDialogHtml(user, c)); }
    case 'correct-open': { const html = user && correctDialogHtml(user, el.dataset.kind, id); return html ? openDialog(html) : toast('That record can’t be corrected by you any more. Ask your team leader.', 'bad'); }
    case 'rep-reset': ui.report = newReportFilter(); return refreshReport('#rep-preset');
    case 'rep-tab': ui.reportTab = el.dataset.tab; return refreshReport('[data-action="rep-tab"][data-tab="' + el.dataset.tab + '"]');
    case 'open-definitions': ui.reportTab = 'definitions'; ui.back = null; return go('reports');
    case 'pipe-from-report': return openPipelineFor(user, el.dataset.kind);
    case 'export-csv': return exportCsv(el.dataset.table);
    case 'pipe-stage': ui.pipeFilter.stage = el.dataset.stage; ui.focusSel = '.stage-chip[data-stage="' + el.dataset.stage + '"]'; return render();
    case 'clear-pipe-filters': ui.pipeFilter = newPipeFilter(); return render();
    case 'open-duplicates': ui.back = backHere(); return go('duplicates');
    case 'pair-different': {
      const r = dismissDuplicate(state, sessionUserId, el.dataset.a, el.dataset.b);
      if (!r.ok) return toast(r.error, 'bad');
      saveState(); render(); return toast('Marked as different people. They won’t be suggested again.');
    }
    case 'pair-merge': { const html = user && mergeDialogHtml(user, el.dataset.a, el.dataset.b); return html ? openDialog(html) : toast('We couldn’t find those records.', 'bad'); }
    case 'area-rename': { const a = state.areas.find(x => x.id === id); if (a) openDialog(renameAreaHtml(a)); return; }
    case 'area-toggle': {
      const a = state.areas.find(x => x.id === id); if (!a) return;
      const r = setAreaActive(state, sessionUserId, id, !a.active);
      if (!r.ok) return toast(r.error, 'bad');
      saveState(); render(); return toast(a.name + (a.active ? ' is active again.' : ' is now inactive.'));
    }
    case 'try-page': { const sel = document.getElementById('try-page'); if (sel) { closeDialog(); go(sel.value); } return; }
    case 'dept-rename': { const d = state.departments.find(x => x.id === id); if (d) openDialog(renameDeptHtml(d)); return; }
    case 'dept-toggle': {
      const d = state.departments.find(x => x.id === id); if (!d) return;
      const r = setDepartmentActive(state, sessionUserId, id, !d.active);
      if (!r.ok) return toast(r.error, 'bad');
      saveState(); render(); return toast(d.name + (d.active ? ' is active again.' : ' is now inactive.'));
    }
  }
}
function applyStatus(id, status) {
  const r = setUserStatus(state, sessionUserId, id, status);
  closeDialog();
  if (!r.ok) return toast(r.error, 'bad');
  saveState(); render(); toast(r.user.name + (status === 'deactivated' ? ' was deactivated.' : ' was reactivated.'));
}
async function copyText(btn) {
  const text = btn.dataset.text; const label = btn.innerHTML;
  const flash = msg => { btn.textContent = msg; setTimeout(() => { btn.innerHTML = label; }, 2200); };
  try { await navigator.clipboard.writeText(text); flash('Copied'); }
  catch (err) {
    const src = document.getElementById(btn.dataset.select);
    if (src && window.getSelection) { const sel = window.getSelection(); sel.removeAllRanges(); const r = document.createRange(); r.selectNodeContents(src); sel.addRange(r); }
    flash('Select and copy');
  }
}
async function onSubmit(e) {
  const form = e.target.closest('form[data-form]'); if (!form) return;
  e.preventDefault();
  if (form.dataset.busy) return;
  const fn = handlers[form.dataset.form]; if (!fn) return;
  try { await fn(form); } catch (err) { console.error(err); setBusy(form, false); showFormError(form, 'Something went wrong. Try again.'); }
}
// Every recorder input carries data-draft="path". Typing writes straight into the draft, so nothing is lost when the screen is redrawn.
function onDraftInput(t) {
  const d = ui.draft, path = t.dataset.draft; if (!d || !DRAFT_PATH.test(path || '') && path !== 'session.participantIds') return false;
  if (path === 'session.participantIds') toggleParticipant(d, t.dataset.multi, !!t.checked);
  else {
    setDraftPath(d, path, t.type === 'checkbox' ? !!t.checked : t.value);
    if (path === 'session.departmentId') d.session.participantIds = [];
  }
  clearDraftError(d, path === 'session.participantIds' ? 'session.participantIds' : path);
  if (t.id) { const err = document.getElementById(t.id + '-err'); if (err) err.textContent = ''; if (t.removeAttribute) t.removeAttribute('aria-invalid'); }
  const m = /^people\.(\d+)\.(name|query)$/.exec(path);
  if (m && m[2] === 'name') { const box = document.getElementById('dup-' + m[1]); if (box) box.innerHTML = dupHintHtml(+m[1]); }
  if (m && m[2] === 'query') { const box = document.getElementById('pr-' + m[1]); if (box) box.innerHTML = pickResultsHtml(+m[1]); }
  if (t.dataset.rerender) render();
  return true;
}
function onInput(e) {
  const t = e.target; if (t.dataset && t.dataset.draft && onDraftInput(t)) return;
  const kind = t.dataset ? t.dataset.input : null; if (!kind) return;
  if (kind === 'people-q') { ui.peopleQ = t.value; document.getElementById('people-table').innerHTML = peopleTable(currentUser()); }
  else if (kind === 'pipe-q') { ui.pipeFilter.q = t.value; document.getElementById('pipeline-table').innerHTML = pipelineTable(currentUser()); }
  else if (kind === 'user-q') { ui.usersFilter.q = t.value; document.getElementById('users-table').innerHTML = usersTable(); }
  else if (kind === 'pw') {
    const form = t.closest('form'); const list = document.getElementById('pw-rules');
    if (form && list) list.innerHTML = rulesHtml(form.elements.password.value, form.elements.email.value);
  }
}
function onChange(e) {
  const t = e.target; if (t.dataset && t.dataset.draft && onDraftInput(t)) return;
  const kind = t.dataset ? t.dataset.input : null; if (!kind) return;
  if (kind.indexOf('rep-') === 0) return onReportInput(t, kind);
  if (kind === 'sess-area') { ui.sessionFilter.area = t.value; document.getElementById('sessions-table').innerHTML = sessionsTable(currentUser()); }
  else if (kind === 'sess-type') { ui.sessionFilter.type = t.value; document.getElementById('sessions-table').innerHTML = sessionsTable(currentUser()); }
  else if (kind === 'user-status') { ui.usersFilter.status = t.value; document.getElementById('users-table').innerHTML = usersTable(); }
  else if (kind === 'user-role') { ui.usersFilter.role = t.value; document.getElementById('users-table').innerHTML = usersTable(); }
  else if (kind === 'role-preview') { const box = document.getElementById('role-preview'); if (box && ROLES[t.value]) box.innerHTML = rolePreview(t.value); }
  else if (kind === 'people-stage') { ui.peopleStage = t.value; document.getElementById('people-table').innerHTML = peopleTable(currentUser()); }
  else if (kind === 'pipe-assignee' || kind === 'pipe-due' || kind === 'pipe-team') { ui.pipeFilter[kind.slice(5)] = t.value; document.getElementById('pipeline-table').innerHTML = pipelineTable(currentUser()); }
  else if (kind === 'contact-outcome' || kind === 'contact-attendance') { if (t.form) syncContactForm(t.form, 'outcome'); }
  else if (kind === 'contact-stage') { if (t.form) { t.form.dataset.stageTouched = '1'; syncContactForm(t.form, 'stage'); } }
  else if (kind === 'stage-to') { if (t.form) syncStageForm(t.form); }
}
function onKey(e) {
  if (e.key !== 'Escape') return;
  if (ui.menuOpen) { ui.menuOpen = false; syncMenu(); const b = document.getElementById('account-btn'); if (b) b.focus(); }
  else if (ui.navOpen) { ui.navOpen = false; syncNav(); }
}
function reloadFromStorage() {
  const fresh = loadState(); if (!fresh) return;
  state = fresh;
  if (!dlg.open) render();
}
document.addEventListener('click', onClick);
document.addEventListener('submit', onSubmit);
document.addEventListener('input', onInput);
document.addEventListener('change', onChange);
document.addEventListener('keydown', onKey);
window.addEventListener('storage', e => { if (e.key === STORE_KEY) reloadFromStorage(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reloadFromStorage(); });

/* ---------- start ---------- */
(async function boot() {
  try {
    if (!window.crypto || !crypto.subtle) throw new Error('Web Crypto is not available');
    state = loadState();
    if (!state) { state = await buildSeed(); saveState(); }
    try { sessionUserId = sessionStorage.getItem(SESSION_KEY) || null; } catch (e) { sessionUserId = null; }
    const u = currentUser();
    if (u) ui.page = landingPage(u); else sessionUserId = null;
    render();
    resolveDownloads();
  } catch (err) {
    console.error(err);
    rootEl.innerHTML = '<div class="boot"><p>This browser can’t run the prototype. It needs a secure (https) page with Web Crypto.</p></div>';
  }
})();
</script>
